# ─────────────────────────────────────────────────────────────────────────────
# eLearning Platform — Helm Values
# ─────────────────────────────────────────────────────────────────────────────

# ── Secrets ───────────────────────────────────────────────────────────────────

# Shared JWT secret — must match between services.
jwtSecret: "change-me-in-production-use-a-long-random-string"

# ── Admin account ─────────────────────────────────────────────────────────────
# Seeded by user-service on startup (idempotent). Three modes:
#
#   Mode 1 — auto-generated (default):
#     Leave password empty. A random 32-char password is generated on first
#     install and persisted in the release Secret. Retrieve it with:
#       kubectl get secret <release>-secrets \
#         -o jsonpath='{.data.ADMIN_PASSWORD}' | base64 -d
#
#   Mode 2 — explicit:
#     admin.password: "MyStr0ngPassw0rd!"
#
#   Mode 3 — existing K8s Secret (Vault / ESO / SOPS):
#     admin.existingSecret: "my-admin-secret"
#
# Passwords may be cleartext or a bcrypt hash (values starting with "$2").
admin:
  password: ""
  existingSecret: ""
  existingSecretKey: "ADMIN_PASSWORD"

# ── Services ──────────────────────────────────────────────────────────────────

courseService:
  replicaCount: 1
  image:
    repository: ghcr.io/towarmat83/elearning-course-service
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env:
    JWT_EXPIRY_HOURS: "24"
    GIT_CACHE_TTL: "10"
    GIT_TOKEN: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}

userService:
  replicaCount: 1
  image:
    repository: ghcr.io/towarmat83/elearning-user-service
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    JWT_EXPIRY_HOURS: "24"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}

frontend:
  image:
    repository: ghcr.io/towarmat83/elearning-frontend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# ── SSO / OAuth ───────────────────────────────────────────────────────────────
# redirectBase: public URL sent to the OIDC provider as redirect_uri.
#   Defaults to the ingress host when empty.
#   Can also be overridden at runtime via the admin UI (oidc_redirect_base setting).
#
# Provider examples:
#   - id: github          # OAuth2 — no issuer_url needed
#     name: GitHub
#     client_id: "..."
#     client_secret: "..."
#
#   - id: gitlab
#     name: GitLab
#     client_id: "..."
#     client_secret: "..."
#     issuer_url: "https://gitlab.com"
#
#   - id: google
#     name: Google
#     client_id: "..."
#     client_secret: "..."
#     issuer_url: "https://accounts.google.com"
sso:
  enabled: false
  redirectBase: ""
  providers: []

# ── Ingress ───────────────────────────────────────────────────────────────────
# Path order matters — more specific paths must come before broader ones.
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: elearning.local
      paths:
        - { path: /api/auth,          pathType: Prefix, backend: user-service   }
        - { path: /api/settings,      pathType: Prefix, backend: user-service   }
        - { path: /api/my,            pathType: Prefix, backend: user-service   }
        - { path: /api/admin/courses, pathType: Prefix, backend: course-service }
        - { path: /api/admin,         pathType: Prefix, backend: user-service   }
        - { path: /api/courses,       pathType: Prefix, backend: course-service }
        - { path: /uploads,           pathType: Prefix, backend: course-service }
        - { path: /health,            pathType: Exact,  backend: course-service }
        - { path: /metrics,           pathType: Prefix, backend: course-service }
        - { path: /,                  pathType: Prefix, backend: frontend       }
  tls: []

# ── Database ──────────────────────────────────────────────────────────────────
# Option A — bundled PostgreSQL (dev / small deployments):
#   postgresql.enabled: true
#
# Option B — external database (production):
#   postgresql.enabled: false
#   externalDatabase.host: "my-pg.example.com"
#   externalDatabase.existingSecret: "my-secret"   # contains DATABASE_URL

postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: elearning
    password: elearning_secret
    database: elearning
    existingSecret: ""       # if set, POSTGRES_PASSWORD is sourced from this Secret
    existingSecretKey: "db_password"
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

externalDatabase:
  host: "elearning-postgresql"
  port: 5432
  name: elearning
  username: elearning
  password: "elearning_secret"
  existingSecret: ""           # if set, DATABASE_URL is read from this Secret
  existingSecretKey: "DATABASE_URL"
