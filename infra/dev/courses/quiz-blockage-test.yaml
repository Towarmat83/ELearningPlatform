apiVersion: elearning.pupitre.io/v1
kind: Course
metadata:
  name: quiz-blockage-test
  namespace: default
spec:
  title: "Test — Blocage des Quiz"
  description: |
    Cours de test pour valider la feature de blocage (lockOnMaxAttempts).
    Contient trois quiz inline avec des configurations de blocage différentes :
      - Quiz 1 : blocage strict (2 tentatives max, puis verrou définitif)
      - Quiz 2 : cooldown exponentiel sans blocage permanent
      - Quiz 3 : blocage + prérequis (le Quiz 1 doit être réussi d'abord)
  category: "internal-testing"
  difficulty: "beginner"
  public: true

  modules:
    - name: "Introduction au blocage"
      type: text
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/01-intro.md"

    - name: "Quiz Blocage Strict"
      type: quiz
      maxAttemptsPerQuestion: 2
      lockOnMaxAttempts: true
      passingScore: 100
      cooldown:
        strategy: exponential
        baseSeconds: 10
        multiplier: 2.0
        maxSeconds: 60
      questions:
        - id: q1
          type: single
          difficulty: easy
          points: 1
          question: "Quelle commande affiche le répertoire courant sous Linux ?"
          answers:
            - id: a
              text: "pwd"
              correct: true
            - id: b
              text: "ls"
              correct: false
            - id: c
              text: "cd"
              correct: false
          feedback:
            wrong: "Ce n'est pas la bonne commande. (max 2 tentatives — module bloqué ensuite)"
            correct: "Correct ! `pwd` affiche le chemin absolu du répertoire courant."

        - id: q2
          type: boolean
          difficulty: easy
          points: 1
          question: "La commande `rm -rf /` supprime uniquement le répertoire courant."
          correctAnswer: false
          feedback:
            wrong: "Attention ! `rm -rf /` supprime la racine entière du système."
            correct: "Exact — cette commande est extrêmement destructrice."

    - name: "Quiz Cooldown Sans Blocage"
      type: quiz
      maxAttemptsPerQuestion: 3
      lockOnMaxAttempts: false
      passingScore: 50
      cooldown:
        strategy: exponential
        baseSeconds: 5
        multiplier: 3.0
        maxSeconds: 120
      prerequisites:
        - "introduction-au-blocage"
      questions:
        - id: q1
          type: single
          difficulty: easy
          points: 1
          question: "Combien de bits compose un octet ?"
          answers:
            - id: a
              text: "4"
              correct: false
            - id: b
              text: "8"
              correct: true
            - id: c
              text: "16"
              correct: false
          feedback:
            wrong: "Réessayez — il y a un cooldown mais pas de blocage définitif."
            correct: "Exact ! 1 octet = 8 bits."

        - id: q2
          type: multiple
          difficulty: medium
          points: 2
          question: "Quels protocoles fonctionnent sur la couche Transport du modèle OSI ?"
          answers:
            - id: a
              text: "TCP"
              correct: true
            - id: b
              text: "HTTP"
              correct: false
            - id: c
              text: "UDP"
              correct: true
            - id: d
              text: "IP"
              correct: false
          partialScoring:
            enabled: true
            allowNegative: false
          feedback:
            wrong: "HTTP est applicatif, IP est réseau. TCP et UDP sont en couche Transport."
            correct: "Parfait ! TCP et UDP opèrent bien en couche 4."

    - name: "Quiz Final avec Prérequis"
      type: quiz
      maxAttemptsPerQuestion: 3
      lockOnMaxAttempts: true
      passingScore: 75
      cooldown:
        strategy: exponential
        baseSeconds: 15
        multiplier: 2.0
        maxSeconds: 300
      prerequisites:
        - "quiz-blocage-strict"
        - "quiz-cooldown-sans-blocage"
      questions:
        - id: q1
          type: order
          difficulty: hard
          points: 3
          question: "Remettez dans l'ordre les couches du modèle OSI (de la plus basse à la plus haute)."
          items:
            - id: i1
              text: "Physique"
            - id: i2
              text: "Réseau"
            - id: i3
              text: "Transport"
            - id: i4
              text: "Application"
          correctOrder: [i1, i2, i3, i4]
          feedback:
            wrong: "L'ordre est : Physique → Liaison → Réseau → Transport → Session → Présentation → Application."
            correct: "Exact ! Vous connaissez le modèle OSI."

        - id: q2
          type: single
          difficulty: medium
          points: 2
          question: "Quel protocole est utilisé pour attribuer dynamiquement des adresses IP ?"
          answers:
            - id: a
              text: "DNS"
              correct: false
            - id: b
              text: "DHCP"
              correct: true
            - id: c
              text: "ARP"
              correct: false
            - id: d
              text: "ICMP"
              correct: false
          feedback:
            wrong: "DNS résout les noms, ARP mappe IP↔MAC, ICMP diagnostique. C'est DHCP."
            correct: "Correct ! DHCP distribue les adresses IP automatiquement."
