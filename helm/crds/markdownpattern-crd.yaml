apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: markdownpatterns.elearning.example.com
spec:
  group: elearning.example.com
  names:
    kind: MarkdownPattern
    plural: markdownpatterns
    singular: markdownpattern
    shortNames: [mdpat]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [name, html]
              properties:
                name:
                  type: string
                  description: Pattern identifier used in |||name syntax
                label:
                  type: string
                scope:
                  type: string
                  default: global
                  description: "global or a course slug"
                html:
                  type: string
                  description: "HTML template — {{content}} replaced by rendered markdown"
                css:
                  type: string
                  default: ""
                js:
                  type: string
                  default: ""
