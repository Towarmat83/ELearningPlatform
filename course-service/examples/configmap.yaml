---
# ConfigMap for course-service
# Mount as file: /etc/course-service/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: course-service-config
  labels:
    app: course-service
data:
  config.yaml: |
    port: 8082
    jwt_secret: "change-me-in-production-use-a-long-random-string"
    jwt_expiry_hours: 24
    cors_origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
    uploads_dir: "/data/uploads"
    k8s_namespace: "default"
    user_service_url: "http://user-service:8081"
    new_feature_enabled: true
    module_content_cache_ttl: 300