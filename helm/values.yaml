# ─────────────────────────────────────────────────────────────────────────────
# eLearning Platform — Helm Values
# Override any value with: helm upgrade --set key=value ...
# ─────────────────────────────────────────────────────────────────────────────

# Shared JWT secret (must match between services)
jwtSecret: "change-me-in-production-use-a-long-random-string"

# ── Course Service (Go, stateless) ──────────────────────────────────────────
courseService:
  replicaCount: 1
  image:
    repository: localhost/elearning-course-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env:
    JWT_EXPIRY_HOURS: "24"
    CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    UPLOADS_DIR: "/data/uploads"
    K8S_NAMESPACE: "default"
    GIT_CACHE_TTL: "10"
    GIT_CREDENTIALS_PATH: "/etc/git-credentials/git-credentials.yaml"
    GIT_TOKEN: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}

# ── User Service (Go, PostgreSQL) ───────────────────────────────────────────
userService:
  replicaCount: 1
  image:
    repository: localhost/elearning-user-service
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    JWT_EXPIRY_HOURS: "24"
    CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    GITLAB_URL: "https://gitlab.com"
    OAUTH_REDIRECT_BASE: ""
    GITLAB_CLIENT_ID: ""
    GITLAB_CLIENT_SECRET: ""
    GITHUB_CLIENT_ID: ""
    GITHUB_CLIENT_SECRET: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}

# ── Frontend (SvelteKit) ────────────────────────────────────────────────────
frontend:
  image:
    repository: localhost/elearning-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env:
    NODE_ENV: "production"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: elearning.local
      paths:
        - path: /api/auth
          pathType: Prefix
          backend: user-service
        - path: /api/settings
          pathType: Prefix
          backend: user-service
        - path: /api/my
          pathType: Prefix
          backend: user-service
        - path: /api/admin
          pathType: Prefix
          backend: user-service
        - path: /api/courses
          pathType: Prefix
          backend: course-service
        - path: /uploads
          pathType: Prefix
          backend: course-service
        - path: /health
          pathType: Exact
          backend: course-service
        - path: /metrics
          pathType: Prefix
          backend: course-service
        - path: /
          pathType: Prefix
          backend: frontend
  tls: []

grafanaIngress:
  enabled: false
  className: traefik
  annotations: {}
  host: grafana.elearning.local
  tls: []

# ── PostgreSQL (internal — deployed manually as standalone deployment) ───────
postgresql:
  enabled: false

externalDatabase:
  host: "elearning-postgresql"
  port: 5432
  name: elearning
  username: elearning
  password: "elearning_secret"
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v3.1.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
  retention: 15d
  persistence:
    enabled: false
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  extraScrapeConfigs: []

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "11.4.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  adminPassword: "admin"
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  extraEnv: []

# ── Prometheus ServiceMonitor (kube-prometheus-stack) ─────────────────────────
serviceMonitor:
  enabled: false
  namespace: monitoring
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: kube-prometheus-stack
