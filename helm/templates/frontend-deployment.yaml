apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elearning.fullname" . }}-frontend
  labels:
    {{- include "elearning.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "elearning.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elearning.frontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.frontend.service.port | quote }}
            - name: NODE_ENV
              value: production
            - name: ORIGIN
              value: {{ include "elearning.publicUrl" . | quote }}
            - name: PUBLIC_API_URL
              value: {{ include "elearning.publicUrl" . | quote }}
            - name: INTERNAL_API_URL
              value: "http://{{ include "elearning.fullname" . }}-user-service:{{ .Values.userService.service.port }}"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
