apiVersion: elearning.example.com/v1
kind: Course
metadata:
  name: networking-essentials
spec:
  title: "Réseaux informatiques essentiels"
  description: "Comprends les fondamentaux des réseaux : modèle OSI, TCP/IP, DNS, HTTP et les protocoles clés. Indispensable pour tout ingénieur DevOps ou développeur."
  category: networking
  difficulty: intermediate
  public: true
  modules:
    - name: "Le modèle OSI"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/01-intro.md"
    - name: "TCP/IP en pratique"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/02-images.md"
      prerequisites:
        - "le-modèle-osi"
    - name: "DNS et résolution de noms"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/03-networking.md"
      prerequisites:
        - "tcp-ip-en-pratique"
    - name: "HTTP et HTTPS"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/04-compose.md"
      prerequisites:
        - "dns-et-résolution-de-noms"
    - name: "Quiz Réseaux"
      type: "quiz"
      inline: true
      prerequisites:
        - "le-modèle-osi"
        - "tcp-ip-en-pratique"
        - "dns-et-résolution-de-noms"
        - "http-et-https"
      passing_score: 70
      questions:
        - text: "Combien de couches compte le modèle OSI ?"
          answers:
            - text: "7"
              correct: true
            - text: "4"
              correct: false
            - text: "5"
              correct: false
            - text: "3"
              correct: false
        - text: "Quel protocole est utilisé pour la résolution de noms de domaine ?"
          answers:
            - text: "DNS"
              correct: true
            - text: "DHCP"
              correct: false
            - text: "FTP"
              correct: false
            - text: "SMTP"
              correct: false
        - text: "Sur quel port HTTPS écoute-t-il par défaut ?"
          answers:
            - text: "443"
              correct: true
            - text: "80"
              correct: false
            - text: "8080"
              correct: false
            - text: "22"
              correct: false
