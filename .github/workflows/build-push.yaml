name: Build & Push

on:
  push:
    branches:
      - main
      - "**ci:**"
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: course-service
            context: ./course-service
          - service: user-service
            context: ./user-service
          - service: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/elearning-${{ matrix.service }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          outputs: type=image,oci-mediatypes=true,push=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  trivy-scan:
    name: Trivy image scan (${{ matrix.service }})
    needs: build-push-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - course-service
          - user-service
          - frontend
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve pushed image reference
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          # metadata-action tags every push with `sha-<short>` (7 chars).
          echo "ref=ghcr.io/${OWNER}/elearning-${{ matrix.service }}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  push-helm-chart:
    needs: build-push-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Lint Helm chart
        run: helm lint helm

      - name: Determine chart version
        id: chart-version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            BASE=$(grep '^version:' helm/Chart.yaml | awk '{print $2}')
            VERSION="${BASE}-sha.$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Patch chart appVersion for tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Patch appVersion directly in Chart.yaml (instead of passing
          # --app-version at package time) so the published version is
          # recorded in the source artifact and auditable during review.
          yq -i '.appVersion = "${{ steps.chart-version.outputs.version }}"' helm/Chart.yaml
          echo "Chart.yaml appVersion set to ${{ steps.chart-version.outputs.version }}"
          grep '^appVersion:' helm/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package helm \
            --version "${{ steps.chart-version.outputs.version }}" \
            --destination /tmp/charts

      - name: Push Helm chart to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push /tmp/charts/elearning-${{ steps.chart-version.outputs.version }}.tgz \
            oci://ghcr.io/${OWNER}/charts
