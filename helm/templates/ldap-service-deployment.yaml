{{- if .Values.ldapService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elearning.fullname" . }}-ldap-service
  labels:
    {{- include "elearning.ldapService.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ldapService.replicaCount }}
  selector:
    matchLabels:
      {{- include "elearning.ldapService.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elearning.ldapService.labels" . | nindent 8 }}
    spec:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.96.0.10
        searches:
          - default.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      containers:
      - name: ldap-service
        image: "{{ .Values.ldapService.image.repository }}:{{ .Values.ldapService.image.tag }}"
        imagePullPolicy: {{ .Values.ldapService.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.ldapService.service.port }}
          protocol: TCP
        env:
        - name: PORT
          value: {{ .Values.ldapService.service.port | quote }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "elearning.fullname" . }}-secrets
              key: DATABASE_URL
        - name: USER_SERVICE_URL
          value: "http://{{ include "elearning.fullname" . }}-user-service:{{ .Values.userService.service.port }}"
        - name: CORS_ORIGINS
          value: {{ .Values.ldapService.env.CORS_ORIGINS | default (include "elearning.publicUrl" .) | quote }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.ldapService.resources | nindent 10 }}
      {{- with .Values.ldapService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "elearning.fullname" . }}-ldap-service
  labels:
    {{- include "elearning.ldapService.labels" . | nindent 4 }}
spec:
  type: {{ .Values.ldapService.service.type }}
  ports:
    - port: {{ .Values.ldapService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "elearning.ldapService.selectorLabels" . | nindent 4 }}
{{- end }}
