id: quiz-fichiers-permissions
title: "Quiz Fichiers et Permissions"
passing_score: 60
questions:
  - id: q1
    type: single
    points: 2
    question: "Que signifie la permission 'r' dans la notation Linux ?"
    answers:
      - id: a
        text: "Renommer"
        correct: false
      - id: b
        text: "Lire (read)"
        correct: true
      - id: c
        text: "Relancer"
        correct: false
      - id: d
        text: "Réinitialiser"
        correct: false
    feedback:
      correct: "Exact ! 'r' signifie read (lecture)."
      wrong: "'r' = read (lire), 'w' = write (écrire), 'x' = execute (exécuter)."

  - id: q2
    type: single
    points: 2
    question: "Quelle commande permet de changer le propriétaire d'un fichier ?"
    answers:
      - id: a
        text: "chmod"
        correct: false
      - id: b
        text: "chown"
        correct: true
      - id: c
        text: "ls -l"
        correct: false
      - id: d
        text: "sudo"
        correct: false
    feedback:
      correct: "Correct ! 'chown' (change owner) modifie le propriétaire."
      wrong: "'chown' change le propriétaire (owner), 'chmod' change les permissions."

  - id: q3
    type: boolean
    points: 1
    question: "La commande 'chmod 755 script.sh' donne le droit d'exécution à tous les utilisateurs."
    correct_answer: true
    feedback:
      correct: "Exact ! 755 = rwxr-xr-x : exécution pour tous."
      wrong: "755 = rwxr-xr-x : le propriétaire a rwx, les autres ont r-x (donc exécution)."

  - id: q4
    type: multiple
    points: 3
    question: "Quels droits sont inclus dans la valeur octale '7' (rwx) ?"
    answers:
      - id: a
        text: "Lecture (r)"
        correct: true
      - id: b
        text: "Écriture (w)"
        correct: true
      - id: c
        text: "Exécution (x)"
        correct: true
      - id: d
        text: "Administration root"
        correct: false
    feedback:
      correct: "Parfait ! 7 en binaire = 111 = r+w+x."
      wrong: "7 = 4(r) + 2(w) + 1(x) = lecture + écriture + exécution."

  - id: q5
    type: single
    points: 2
    question: "Que fait la commande 'sudo' ?"
    answers:
      - id: a
        text: "Affiche la liste des utilisateurs du système"
        correct: false
      - id: b
        text: "Exécute une commande avec les droits administrateur (root)"
        correct: true
      - id: c
        text: "Supprime un utilisateur du système"
        correct: false
      - id: d
        text: "Chiffre un fichier"
        correct: false
    feedback:
      correct: "Exact ! 'sudo' (superuser do) exécute une commande en tant que root."
      wrong: "'sudo' permet d'exécuter une commande avec les privilèges root."
