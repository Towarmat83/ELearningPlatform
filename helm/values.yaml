# ─────────────────────────────────────────────────────────────────────────────
# eLearning Platform — Helm Values
# Override any value with: helm upgrade --set key=value ...
# ─────────────────────────────────────────────────────────────────────────────

# Global replica count (applies to API and frontend)
replicaCount: 1

# ── API (Rust backend) ────────────────────────────────────────────────────────
api:
  image:
    repository: elearning-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    JWT_EXPIRY_HOURS: "24"
    RUST_LOG: "info"
  # JWT secret — override with a strong random string in production
  # Use: --set api.jwtSecret=$(openssl rand -hex 32)
  jwtSecret: "change-me-in-production-use-32+-chars"
  # Docker socket for interactive labs (mounts /var/run/docker.sock)
  # Disable on managed clusters that don't allow host socket access
  dockerSocket:
    enabled: true
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# ── Frontend (SvelteKit) ──────────────────────────────────────────────────────
frontend:
  image:
    repository: elearning-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: traefik  # or nginx
  annotations: {}
    # nginx: set these for WebSocket terminal support:
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    # nginx.ingress.kubernetes.io/configuration-snippet: |
    #   proxy_set_header Upgrade $http_upgrade;
    #   proxy_set_header Connection "upgrade";
  hosts:
    - host: elearning.local
      paths:
        - path: /api
          pathType: Prefix
          backend: api
        - path: /ws
          pathType: Prefix
          backend: api
        - path: /metrics
          pathType: Prefix
          backend: api
        - path: /health
          pathType: Exact
          backend: api
        - path: /
          pathType: Prefix
          backend: frontend
  tls: []
  # tls:
  #   - secretName: elearning-tls
  #     hosts:
  #       - elearning.local

# Separate ingress for Grafana (optional)
grafanaIngress:
  enabled: false
  className: traefik
  annotations: {}
  host: grafana.elearning.local
  tls: []

# ── PostgreSQL (Bitnami chart) ────────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    database: elearning
    username: elearning
    password: elearning_secret
    # Production: use an existing secret instead of plain password
    # existingSecret: elearning-db-secret
    # existingSecretPasswordKey: postgres-password
  primary:
    persistence:
      enabled: true
      size: 10Gi
      # storageClass: ""
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "1Gi"
        cpu: "500m"

# External PostgreSQL (when postgresql.enabled = false)
externalDatabase:
  host: ""
  port: 5432
  name: elearning
  username: elearning
  password: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v3.1.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
  retention: 15d
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  # Extra scrape configs appended to the default API scrape
  extraScrapeConfigs: []

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "11.4.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  # Admin password — override in production
  adminPassword: "admin"
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  # Extra environment variables for Grafana
  extraEnv: []
  # - name: GF_AUTH_ANONYMOUS_ENABLED
  #   value: "true"

# ── Prometheus ServiceMonitor (kube-prometheus-stack) ─────────────────────────
serviceMonitor:
  enabled: false
  namespace: monitoring
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: kube-prometheus-stack
