{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "elearning.fullname" . }}
  labels:
    {{- include "elearning.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: {{ include "elearning.fullname" . }}-user-service
                port:
                  name: http
          - path: /api/settings
            pathType: Prefix
            backend:
              service:
                name: {{ include "elearning.fullname" . }}-user-service
                port:
                  name: http
          - path: /api/my
            pathType: Prefix
            backend:
              service:
                name: {{ include "elearning.fullname" . }}-user-service
                port:
                  name: http
          - path: /api/admin/courses
            pathType: Prefix
            backend:
              service:
                name: {{ include "elearning.fullname" . }}-course-service
                port:
                  name: http
          - path: /api/admin/lab-checks
            pathType: Prefix
            backend:
              service:
                name: {{ include "elearning.fullname" . }}-course-service
                port:
                  name: http
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: {{ include "elearning.fullname" . }}-user-service
                port:
                  name: http
          - path: /api/courses
            pathType: Prefix
            backend:
              service:
                name: {{ include "elearning.fullname" . }}-course-service
                port:
                  name: http
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: {{ include "elearning.fullname" . }}-course-service
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "elearning.fullname" . }}-course-service
                port:
                  name: http
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: {{ include "elearning.fullname" . }}-course-service
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "elearning.fullname" . }}-frontend
                port:
                  name: http
{{- end }}
