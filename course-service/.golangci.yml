# golangci-lint configuration — course-service
# Schema v2 (golangci-lint v2.x / golangci-lint-action@v8)
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - misspell
    - unconvert
  exclusions:
    rules:
      # Test files: relax errcheck for setup helpers (os.WriteFile, defer os.Remove, w.Write, etc.)
      - path: ".*_test\\.go$"
        linters:
          - errcheck
      # defer resp.Body.Close() is an accepted Go idiom; the error is unrecoverable
      - source: "defer .+\\.Body\\.Close\\(\\)"
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/elearning/course-service
