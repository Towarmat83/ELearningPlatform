---
# Env-style ConfigMap (used via envFrom)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elearning.fullname" . }}-course-service-config
  labels:
    {{- include "elearning.courseService.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.courseService.service.port | quote }}
  JWT_EXPIRY_HOURS: {{ .Values.courseService.env.JWT_EXPIRY_HOURS | quote }}
  CORS_ORIGINS: {{ .Values.courseService.env.CORS_ORIGINS | default (include "elearning.publicUrl" .) | quote }}
  UPLOADS_DIR: {{ .Values.courseService.env.UPLOADS_DIR | quote }}
  K8S_NAMESPACE: {{ .Values.courseService.env.K8S_NAMESPACE | quote }}

---
# File-style ConfigMap (mount as volume, set CONFIG_PATH)
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elearning.fullname" . }}-course-service-config-file
  labels:
    {{- include "elearning.courseService.labels" . | nindent 4 }}
data:
  config.yaml: |
    port: {{ .Values.courseService.service.port }}
    jwt_expiry_hours: {{ .Values.courseService.env.JWT_EXPIRY_HOURS }}
    cors_origins:
      - "{{ first .Values.ingress.hosts | default "http://localhost:3000" }}"
    uploads_dir: {{ .Values.courseService.env.UPLOADS_DIR | quote }}
    k8s_namespace: {{ .Values.courseService.env.K8S_NAMESPACE | quote }}
    user_service_url: "http://{{ include "elearning.fullname" . }}-user-service:{{ .Values.userService.service.port }}"
