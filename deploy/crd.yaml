apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: courses.elearning.example.com
spec:
  group: elearning.example.com
  names:
    kind: Course
    plural: courses
    singular: course
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                hidden:
                  type: boolean
                category:
                  type: string
                difficulty:
                  type: string
                prerequisites:
                  type: array
                  items:
                    type: string
                modules:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [video, text, image, quiz]
                      src:
                        type: string
                      ref:
                        type: string
                      path:
                        type: string
                      replication:
                        type: boolean
                      hidden:
                        type: boolean
                      quiz_ref:
                        type: string
                      prerequisites:
                        type: array
                        items:
                          type: string
                      passing_score:
                        type: integer
                      lock_on_max_attempts:
                        type: boolean
                      max_attempts_per_question:
                        type: integer
                      cooldown:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      questions:
                        type: array
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true