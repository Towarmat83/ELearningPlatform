# Authentik values for Kind (local dev — no PVCs, no ingress, port-forward only)

authentik:
  secret_key: "9QqWSmyIZ8+NbwQg6pjmw6betfjoBSj/D/IluER6ndA="
  log_level: info
  error_reporting:
    enabled: false
  bootstrap_password: "AkAdmin@1234"
  bootstrap_token: "elearning-bootstrap-token"
  bootstrap_email: "admin@elearning.local"

  postgresql:
    host: "authentik-postgresql"
    name: "authentik"
    user: "authentik"
    password: "authentik-dev"

# ── Server ────────────────────────────────────────────────────────────────────
server:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    type: ClusterIP

# ── Worker ────────────────────────────────────────────────────────────────────
worker:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ── PostgreSQL (bundled bitnami) ───────────────────────────────────────────────
postgresql:
  enabled: true
  auth:
    username: authentik
    database: authentik
    password: "authentik-dev"
  primary:
    persistence:
      enabled: false   # emptyDir — data lost on restart (fine for dev)
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ── Disable unused features for Kind ─────────────────────────────────────────
geoip:
  enabled: false

prometheus:
  rules:
    enabled: false
