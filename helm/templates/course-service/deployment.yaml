apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elearning.fullname" . }}-course-service
  labels:
    {{- include "elearning.courseService.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.courseService.replicaCount }}
  strategy:
    {{- toYaml .Values.courseService.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "elearning.courseService.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elearning.courseService.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.courseService.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "elearning.fullname" . }}-course-service
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: course-service
        image: "{{ .Values.courseService.image.repository }}:{{ .Values.courseService.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.courseService.image.pullPolicy }}
        securityContext:
          {{- include "elearning.securityContext" . | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.courseService.service.port }}
          protocol: TCP
        env:
        - name: CONFIG_PATH
          value: /etc/course-service/config.yaml
        - name: LOG_LEVEL
          value: {{ .Values.courseService.env.LOG_LEVEL | quote }}
        - name: LOG_FORMAT
          value: {{ .Values.courseService.env.LOG_FORMAT | quote }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "elearning.jwtSecretName" . }}
              key: {{ include "elearning.jwtSecretKey" . }}
        - name: INTERNAL_SERVICE_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "elearning.internalSecretName" . }}
              key: {{ include "elearning.internalSecretKey" . }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "elearning.databaseUrlSecretName" . }}
              key: {{ include "elearning.databaseUrlSecretKey" . }}
        {{- if eq (include "elearning.gitTokenEnabled" .) "true" }}
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "elearning.gitTokenSecretName" . }}
              key: {{ include "elearning.gitTokenSecretKey" . }}
        {{- end }}
        {{- with .Values.courseService.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/course-service
          readOnly: true
        - name: git-credentials
          mountPath: /etc/git-credentials
          readOnly: true
        - name: tmp
          mountPath: /tmp
        {{- with .Values.courseService.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.courseService.resources | nindent 10 }}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config
        configMap:
          name: {{ include "elearning.fullname" . }}-course-service-config
      - name: git-credentials
        secret:
          secretName: course-repo-secret
          optional: true
      - name: tmp
        emptyDir: {}
      {{- with .Values.courseService.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.courseService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.courseService.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
