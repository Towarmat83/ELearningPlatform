apiVersion: elearning.example.com/v1
kind: Course
metadata:
  name: kubernetes-basics
spec:
  title: "Kubernetes Basics"
  description: "Learn the fundamentals of Kubernetes: pods, deployments, services, and more. A hands-on course for beginners."
  hidden: false
  category: "kubernetes"
  difficulty: "beginner"
  modules:
    - name: "What is Kubernetes"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/01-intro.md"
    - name: "Pods and Containers"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/02-images.md"
    - name: "Kubernetes Architecture Overview"
      type: "video"
      src: "https://video-previews.elements.envatousercontent.com/files/bb160b9d-c332-4865-9a90-1123440f86d0/video_preview_h264.mp4"
      replication: true
      hidden: true
    - name: "Deployments"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/03-networking.md"
    - name: "Services"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/04-compose.md"
    - name: "Kubernetes Basics Quiz"
      type: "quiz"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "quizzes/kubernetes-basics.yaml"