openapi: "3.1.0"
info:
  title: User Service API
  description: >
    User Service — auth, profiles, enrollments, lesson progress, platform
    settings, and admin user management. Internal API endpoints for the
    Course Service are under `/internal/`.
  version: "1.0.0"
servers:
  - url: http://localhost:8081
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

    UserPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, student]
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        isActive:
          type: boolean
        authProvider:
          type: string
        createdAt:
          type: string
      required: [id, username, email, role, isActive, authProvider, createdAt]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserPublic"
      required: [token, user]

  parameters:
    courseSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    lessonSlug:
      name: lessonSlug
      in: path
      required: true
      schema:
        type: string
    userId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid

paths:
  # ── Health & Metrics ──────────────────────────────────────────────────────────
  /health:
    get:
      summary: Health check
      tags: [Infrastructure]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string
                  version:
                    type: string

  /metrics:
    get:
      summary: Prometheus metrics
      tags: [Infrastructure]
      responses:
        "200":
          description: Prometheus metrics page
          content:
            text/plain: {}

  # ── Settings ──────────────────────────────────────────────────────────────────
  /api/settings/public:
    get:
      summary: Get public platform settings
      tags: [Settings]
      responses:
        "200":
          description: Public settings
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string

  # ── Auth ──────────────────────────────────────────────────────────────────────
  /api/auth/register:
    post:
      summary: Register a new user account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [username, email, password]
      responses:
        "200":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email or username already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/login:
    post:
      summary: Login with email and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
              required: [email, password]
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/me:
    get:
      summary: Get authenticated user profile
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/auth/profile:
    put:
      summary: Update user profile
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                bio:
                  type: string
                  nullable: true
                avatarUrl:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"

  /api/auth/password:
    put:
      summary: Change password
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                oldPassword:
                  type: string
                newPassword:
                  type: string
              required: [oldPassword, newPassword]
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # ── OAuth ─────────────────────────────────────────────────────────────────────
  /api/auth/oauth/providers:
    get:
      summary: List configured OAuth providers
      tags: [Auth]
      responses:
        "200":
          description: OAuth providers list
          content:
            application/json:
              schema:
                type: object
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string

  /api/auth/oauth/{provider}/authorize:
    get:
      summary: Get OAuth authorization URL
      tags: [Auth]
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [gitlab, github]
      responses:
        "200":
          description: Authorization URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  state:
                    type: string

  /api/auth/oauth/callback:
    post:
      summary: Complete OAuth login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                state:
                  type: string
              required: [code, state]
      responses:
        "200":
          description: OAuth login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  # ── Enrollments ───────────────────────────────────────────────────────────────
  /api/courses/{slug}/enroll:
    post:
      summary: Enroll in a course
      tags: [Enrollments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/courseSlug"
      responses:
        "200":
          description: Enrolled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/courses/{slug}/unenroll:
    delete:
      summary: Unenroll from a course
      tags: [Enrollments]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/courseSlug"
      responses:
        "200":
          description: Unenrolled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # ── Progress ──────────────────────────────────────────────────────────────────
  /api/courses/{slug}/lessons/{lessonSlug}/complete:
    post:
      summary: Mark a lesson as complete
      tags: [Progress]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/courseSlug"
        - $ref: "#/components/parameters/lessonSlug"
      responses:
        "200":
          description: Lesson marked as complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # ── My Courses ────────────────────────────────────────────────────────────────
  /api/my/courses:
    get:
      summary: Get enrolled courses with progress stats
      tags: [Courses]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Enrolled courses
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        viewed_lessons:
                          type: integer
                        lastActivity:
                          type: string
                          nullable: true

  # ── Admin: Settings ───────────────────────────────────────────────────────────
  /api/admin/settings:
    get:
      summary: Get all platform settings (admin)
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Platform settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                        value:
                          type: string
                        description:
                          type: string
                          nullable: true
    put:
      summary: Update platform settings (admin)
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        "200":
          description: Settings updated

  # ── Admin: Stats ──────────────────────────────────────────────────────────────
  /api/admin/stats:
    get:
      summary: Get platform statistics (admin)
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_users:
                    type: integer
                  total_enrollments:
                    type: integer
                  totalCourses:
                    type: integer
                  total_labs:
                    type: integer
                  total_submissions:
                    type: integer
                  success_rate:
                    type: string

  # ── Admin: Users ──────────────────────────────────────────────────────────────
  /api/admin/users:
    get:
      summary: List all users (admin)
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        username:
                          type: string
                        email:
                          type: string
                        role:
                          type: string
                        isActive:
                          type: boolean
                        avatarUrl:
                          type: string
                          nullable: true
                        bio:
                          type: string
                          nullable: true
                        createdAt:
                          type: string
                        enrolledCourses:
                          type: integer
                  total:
                    type: integer

  /api/admin/users/search:
    get:
      summary: Search users by username or email (admin)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        username:
                          type: string
                        email:
                          type: string

  /api/admin/users/{userId}:
    get:
      summary: Get user details (admin)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  username:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                  isActive:
                    type: boolean
                  avatarUrl:
                    type: string
                    nullable: true
                  bio:
                    type: string
                    nullable: true
                  createdAt:
                    type: string
                  enrolledCourses:
                    type: integer
                  viewed_lessons:
                    type: integer
    put:
      summary: Update user (admin)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                bio:
                  type: string
                  nullable: true
                avatarUrl:
                  type: string
                  nullable: true
                isActive:
                  type: boolean
                role:
                  type: string
                  enum: [admin, student]
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
    delete:
      summary: Delete user (admin)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # ── Admin: Course Enrollments ─────────────────────────────────────────────────
  /api/admin/courses/{slug}/enrollments:
    get:
      summary: List course enrollments (admin)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/courseSlug"
      responses:
        "200":
          description: Enrollment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrollments:
                    type: array
                    items:
                      type: object
                      properties:
                        userId:
                          type: string
                        username:
                          type: string
                        email:
                          type: string
                        enrolledAt:
                          type: string
    post:
      summary: Enroll a user in a course (admin)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/courseSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
              required: [userId]
      responses:
        "200":
          description: User enrolled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/admin/courses/{slug}/enrollments/{userId}:
    delete:
      summary: Unenroll a user from a course (admin)
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/courseSlug"
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: User unenrolled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  # ── Admin: Sync Progress ──────────────────────────────────────────────────────
  /api/admin/sync-progress:
    post:
      summary: Manually sync lesson progress (admin)
      tags: [Admin]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                courseSlug:
                  type: string
                lessonSlug:
                  type: string
              required: [userId, courseSlug, lessonSlug]
      responses:
        "200":
          description: Progress synced
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean

  # ── Internal API ──────────────────────────────────────────────────────────────
  /internal/enrollments/check:
    get:
      summary: Check if a user is enrolled (internal)
      tags: [Internal]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: courseSlug
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Enrollment status
          content:
            application/json:
              schema:
                type: object
                properties:
                  enrolled:
                    type: boolean

  /internal/progress/viewed:
    get:
      summary: Get viewed lessons for a course (internal)
      tags: [Internal]
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: courseSlug
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Viewed lesson slugs
          content:
            application/json:
              schema:
                type: object
                properties:
                  viewed:
                    type: array
                    items:
                      type: string

  /internal/progress/complete:
    post:
      summary: Mark a lesson complete (internal)
      tags: [Internal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                  format: uuid
                courseSlug:
                  type: string
                lessonSlug:
                  type: string
              required: [userId, courseSlug, lessonSlug]
      responses:
        "200":
          description: Lesson marked complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
