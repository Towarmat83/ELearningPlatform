name: Containers Validation

# KICS: static Dockerfile analysis on PRs and pushes.
# Build: always runs to validate the build passes.
# Push + Trivy: only on tagged releases.

on:
  push:
    branches:
      - main
      - "**ci:**"
    tags:
      - "v*"
  pull_request:
    paths:
      - "course-service/**"
      - "user-service/**"
      - "checker-service/**"
      - ".github/workflows/ci-containers.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kics-dockerfile:
    name: KICS Dockerfile scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run KICS
        uses: checkmarx/kics-github-action@v2.1.20
        with:
          path: "course-service/Dockerfile,user-service/Dockerfile,frontend/Dockerfile,checker-service/Dockerfile"
          platform_type: Dockerfile
          output_path: kics-results
          output_formats: "sarif"
          # Fail the build on high/medium findings; low/info are reported in
          # the Security tab but kept informational.
          fail_on: high,medium

  build-push-images:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: course-service
            context: ./course-service
          - service: user-service
            context: ./user-service
          - service: frontend
            context: ./frontend
          - service: checker-service
            context: ./checker-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up version variables
        id: vars
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            TAGS="ghcr.io/${OWNER}/elearning-${{ matrix.service }}:${VERSION}
          ghcr.io/${OWNER}/elearning-${{ matrix.service }}:${MAJOR}.${MINOR}
          ghcr.io/${OWNER}/elearning-${{ matrix.service }}:${MAJOR}
          ghcr.io/${OWNER}/elearning-${{ matrix.service }}:latest
          ghcr.io/${OWNER}/elearning-${{ matrix.service }}:${SHORT_SHA}"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            TAGS="ghcr.io/${OWNER}/elearning-${{ matrix.service }}:${SHORT_SHA}"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ steps.vars.outputs.push == 'true' }}
          tags: ${{ steps.vars.outputs.tags }}
          labels: |
            org.opencontainers.image.title=elearning-${{ matrix.service }}
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  trivy-scan:
    name: Trivy image scan (${{ matrix.service }})
    needs: build-push-images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        service:
          - course-service
          - user-service
          - checker-service
          - frontend
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image reference
        id: image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${OWNER}/elearning-${{ matrix.service }}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
