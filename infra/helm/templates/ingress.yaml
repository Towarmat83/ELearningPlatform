{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "elearning.fullname" . }}
  labels:
    {{- include "elearning.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "elearning.fullname" $ }}-{{ .backend }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
---
{{- if .Values.grafanaIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "elearning.fullname" . }}-grafana
  labels:
    {{- include "elearning.grafana.labels" . | nindent 4 }}
  {{- with .Values.grafanaIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.grafanaIngress.className }}
  ingressClassName: {{ .Values.grafanaIngress.className }}
  {{- end }}
  {{- if .Values.grafanaIngress.tls }}
  tls:
    {{- toYaml .Values.grafanaIngress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.grafanaIngress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "elearning.fullname" . }}-grafana
                port:
                  name: http
{{- end }}
