apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elearning.fullname" . }}-user-service
  labels:
    {{- include "elearning.userService.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.userService.replicaCount }}
  strategy:
    {{- toYaml .Values.userService.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "elearning.userService.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elearning.userService.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.userService.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: {{ include "elearning.fullname" . }}-user-service
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: user-service
        image: "{{ .Values.userService.image.repository }}:{{ .Values.userService.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.userService.image.pullPolicy }}
        securityContext:
          {{- include "elearning.securityContext" . | nindent 10 }}
        ports:
        - name: http
          containerPort: {{ .Values.userService.service.port }}
          protocol: TCP
        env:
        - name: CONFIG_PATH
          value: /etc/user-service/config.yaml
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "elearning.jwtSecretName" . }}
              key: {{ include "elearning.jwtSecretKey" . }}
        - name: OAUTH_REDIRECT_BASE
          value: {{ .Values.sso.redirectBase | default (include "elearning.publicUrl" .) | quote }}
        {{- if .Values.sso.oidc.enabled }}
        # OIDC bootstrap — seeded into platform_settings on startup. The client
        # secret is mounted as a file (OIDC_CLIENT_SECRET_FILE), never an env var.
        - name: OIDC_ENABLED
          value: "true"
        - name: OIDC_PROVIDER_URL
          value: {{ .Values.sso.oidc.providerURL | quote }}
        {{- if .Values.sso.oidc.issuerURL }}
        - name: OIDC_ISSUER_URL
          value: {{ .Values.sso.oidc.issuerURL | quote }}
        {{- end }}
        - name: OIDC_CLIENT_ID
          value: {{ .Values.sso.oidc.clientID | quote }}
        - name: OIDC_SCOPES
          value: {{ .Values.sso.oidc.scopes | quote }}
        - name: OIDC_GROUP_CLAIM
          value: {{ .Values.sso.oidc.groupClaim | quote }}
        {{- if .Values.sso.oidc.browserBaseURL }}
        - name: OIDC_BROWSER_BASE_URL
          value: {{ .Values.sso.oidc.browserBaseURL | quote }}
        {{- end }}
        {{- if .Values.sso.oidc.redirectBase }}
        - name: OIDC_REDIRECT_BASE
          value: {{ .Values.sso.oidc.redirectBase | quote }}
        {{- end }}
        - name: OIDC_CLIENT_SECRET_FILE
          value: /etc/oidc/OIDC_CLIENT_SECRET
        {{- if .Values.sso.oidc.insecureSkipVerify }}
        - name: OIDC_INSECURE_SKIP_VERIFY
          value: "true"
        {{- end }}
        {{- end }}
        {{- if .Values.sso.enabled }}
        {{- range .Values.sso.providers }}
        {{- if or .client_secret .existingSecret }}
        - name: SSO_{{ .id | upper }}_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              {{- if .existingSecret }}
              name: {{ .existingSecret | quote }}
              key: {{ .existingSecretKey | default "client_secret" | quote }}
              {{- else }}
              name: {{ include "elearning.fullname" $ }}-secrets
              key: SSO_{{ .id | upper }}_CLIENT_SECRET
              {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "elearning.databaseUrlSecretName" . }}
              key: {{ include "elearning.databaseUrlSecretKey" . }}
        # ADMIN_PASSWORD is exposed as a file (not an env var) so the kubelet
        # refreshes it automatically when the Secret changes — no pod restart needed.
        - name: ADMIN_PASSWORD_FILE
          value: /etc/admin-password/ADMIN_PASSWORD
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        {{- with .Values.userService.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        volumeMounts:
        - name: config
          mountPath: /etc/user-service
          readOnly: true
        - name: admin-password
          mountPath: /etc/admin-password
          readOnly: true
        {{- if .Values.sso.oidc.enabled }}
        - name: oidc-secret
          mountPath: /etc/oidc
          readOnly: true
        {{- end }}
        {{- with .Values.userService.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 30
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        resources:
          {{- toYaml .Values.userService.resources | nindent 10 }}
      terminationGracePeriodSeconds: 60
      volumes:
      - name: config
        configMap:
          name: {{ include "elearning.fullname" . }}-user-service-config
      # Admin password secret — mounted as a file so the kubelet can refresh it
      # live when the Secret is updated (no pod restart required).
      - name: admin-password
        secret:
          {{- if .Values.admin.existingSecret }}
          secretName: {{ .Values.admin.existingSecret | quote }}
          items:
            - key: {{ .Values.admin.existingSecretKey | quote }}
              path: ADMIN_PASSWORD
          {{- else }}
          secretName: {{ include "elearning.fullname" . }}-secrets
          items:
            - key: ADMIN_PASSWORD
              path: ADMIN_PASSWORD
          {{- end }}
      {{- if .Values.sso.oidc.enabled }}
      # OIDC client secret — mounted as a file so it never appears in the pod env.
      - name: oidc-secret
        secret:
          {{- if .Values.sso.oidc.existingSecret }}
          secretName: {{ .Values.sso.oidc.existingSecret | quote }}
          items:
            - key: {{ .Values.sso.oidc.existingSecretKey | quote }}
              path: OIDC_CLIENT_SECRET
          {{- else }}
          secretName: {{ include "elearning.fullname" . }}-secrets
          items:
            - key: OIDC_CLIENT_SECRET
              path: OIDC_CLIENT_SECRET
          {{- end }}
      {{- end }}
      {{- with .Values.userService.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.userService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.userService.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
