jwtSecret: "dev-jwt-secret-for-kind-cluster-min-32-chars!!"

# ── Image configuration ───────────────────────────────────────────────────────
# In dev: images are built locally with Podman and loaded into Kind.
# Build: podman build -t localhost/pupitre-<service>:dev .
# Load:  KIND_EXPERIMENTAL_PROVIDER=podman kind load docker-image localhost/pupitre-<service>:dev --name pupitre
# Then set image.repository/tag below to match.

courseService:
  image:
    repository: localhost/pupitre-course-service
    tag: dev
    pullPolicy: Never # Never pull — image must be pre-loaded into Kind
  service:
    type: NodePort
    port: 8082
    nodePort: 30082
  env:
    JWT_EXPIRY_HOURS: "72"
    GIT_CACHE_TTL: "1" # Short TTL in dev for quick iteration

userService:
  image:
    repository: localhost/pupitre-user-service
    tag: dev
    pullPolicy: Never
  service:
    type: NodePort
    port: 8081
    nodePort: 30081
  env:
    JWT_EXPIRY_HOURS: "72"

frontend:
  # In dev: frontend runs outside k8s via "npm run dev" on the host.
  # Enable this only if you want to test the containerised build.
  replicaCount: 0
  image:
    repository: localhost/pupitre-frontend
    tag: dev
    pullPolicy: Never
  service:
    type: NodePort
    port: 3000
    nodePort: 30080

# ── Database (CNPG) ───────────────────────────────────────────────────────────
# CNPG cluster "platform-db" creates a secret "platform-db-app" with a "uri" key.
# The chart reads DATABASE_URL from that secret.
postgresql:
  enabled: false # use CNPG instead

database:
  name: pupitre
  auth:
    existingSecret: "platform-db-app"
    urlKey: "uri" # CNPG secret key for the full postgresql URI
    passwordKey: "" # not used when urlKey is set

# ── SSO — Keycloak OIDC (wks-main realm) ─────────────────────────────────────
# The user-service uses a split-horizon OIDC setup:
#   - oidc_provider_url    → internal k8s URL for discovery (pod-to-pod)
#   - oidc_issuer_url      → external URL matching the `iss` claim in tokens
#   - oidc_browser_base_url → rewrites the internal authorization endpoint to the
#                             external URL so the browser is redirected correctly
#
# These settings live in the `settings` DB table (not in this file).
# After deploying user-service, seed them once:
#
#   kubectl exec -n pupitre deploy/pupitre-user-service -- \
#     psql "$DATABASE_URL" -c "
#       INSERT INTO settings (key, value) VALUES
#         ('oidc_enabled',          'true'),
#         ('oidc_provider_url',     'http://keycloak-service.keycloak.svc.cluster.local:8080/realms/wks-main'),
#         ('oidc_issuer_url',       'http://keycloak.local:8884/realms/wks-main'),
#         ('oidc_browser_base_url', 'http://keycloak.local:8884'),
#         ('oidc_client_id',        'pupitre'),
#         ('oidc_client_secret',    'pupitre-keycloak-dev-secret'),
#         ('oidc_scopes',           'openid email profile'),
#         ('oidc_redirect_base',    'http://localhost:4321')
#       ON CONFLICT (key) DO UPDATE SET value = EXCLUDED.value;"
sso:
  enabled: false # OAuth providers (GitHub etc.) — OIDC via Keycloak uses DB settings above

# ── Ingress — disabled, using NodePort in local dev ───────────────────────────
ingress:
  enabled: false

# ── Network policies ──────────────────────────────────────────────────────────
networkPolicy:
  enabled: false # Kind's default CNI (kindnet) supports NetworkPolicy; enable when needed

# ── Admin account ─────────────────────────────────────────────────────────────
admin:
  password: "devpassword"
