---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: paths.elearning.pupitre.io
spec:
  group: elearning.pupitre.io
  names:
    kind: Path
    listKind: PathList
    plural: paths
    shortNames:
    - path
    singular: path
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.title
      name: Title
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Path is the Schema for the paths API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PathSpec defines the desired state of a Path.
            properties:
              courses:
                description: |-
                  Courses is the ordered list of course slugs that compose this path (kind=course).
                  Each slug must match an existing Course resource in the same namespace.
                items:
                  minLength: 1
                  pattern: ^[a-z0-9][a-z0-9-]*$
                  type: string
                type: array
              description:
                description: Description provides a brief overview of the path's goals
                  and content.
                type: string
              kind:
                default: course
                description: |-
                  Kind distinguishes course-based paths ("course") from skill-based paths ("skill").
                  Defaults to "course".
                enum:
                - course
                - skill
                type: string
              level:
                description: 'Level indicates the difficulty of the path: beginner,
                  intermediate, advanced.'
                enum:
                - beginner
                - intermediate
                - advanced
                type: string
              skills:
                description: |-
                  Skills is the ordered list of skill tags that compose this path (kind=skill).
                  Completion of a skill is driven by completing all modules that teach it.
                items:
                  type: string
                type: array
              title:
                description: Title is the human-readable name of this learning path.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
