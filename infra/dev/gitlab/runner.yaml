apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-runner-config
  namespace: gitlab
data:
  config.toml: |
    concurrent = 4
    check_interval = 3

    [[runners]]
      name = "kind-shell-runner"
      url = "http://gitlab-http.gitlab.svc.cluster.local"
      token = "glrtr-s-MH_kC_5Cya7utxNnbN"
      executor = "shell"
      clone_url = "http://gitlab-http.gitlab.svc.cluster.local"
      [runners.cache]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-runner
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-runner
  template:
    metadata:
      labels:
        app: gitlab-runner
    spec:
      containers:
      - name: gitlab-runner
        image: gitlab/gitlab-runner:alpine
        command:
        - /bin/sh
        - -c
        - |
          apk add --no-cache python3 py3-pip git bash 2>/dev/null
          exec gitlab-runner run --config /etc/gitlab-runner/config.toml
        volumeMounts:
        - name: config
          mountPath: /etc/gitlab-runner
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
      volumes:
      - name: config
        configMap:
          name: gitlab-runner-config
      - name: tmp
        emptyDir: {}
