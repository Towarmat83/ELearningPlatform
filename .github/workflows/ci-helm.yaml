name: CI — Helm

# Pre-publish validation of the Helm chart. Runs on every PR / push to main
# touching the chart. Chart publishing runs only on tagged releases.

on:
  push:
    branches:
      - main
    paths:
      - "helm/**"
      - ".github/workflows/ci-helm.yaml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "helm/**"
      - ".github/workflows/ci-helm.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.1

      - name: Patch chart appVersion
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            APP_VERSION="${GITHUB_SHA::7}"
          fi
          yq -i ".appVersion = \"${APP_VERSION}\"" helm/Chart.yaml

      - name: helm lint --strict
        run: helm lint helm --strict

  helm-unittest:
    name: Helm unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.1

      - name: Patch chart appVersion
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            APP_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            APP_VERSION="${GITHUB_SHA::7}"
          fi
          yq -i ".appVersion = \"${APP_VERSION}\"" helm/Chart.yaml

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Run helm unit tests
        run: helm unittest helm

  push-helm-chart:
    name: Publish Helm chart
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [helm-lint, helm-unittest]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.2.1

      - name: Log in to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Determine chart version
        id: chart
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Patch chart appVersion
        run: yq -i '.appVersion = "${{ steps.chart.outputs.version }}"' helm/Chart.yaml

      - name: Package Helm chart
        run: |
          helm package helm \
            --version "${{ steps.chart.outputs.version }}" \
            --destination /tmp/charts

      - name: Push Helm chart to GHCR
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push /tmp/charts/elearning-${{ steps.chart.outputs.version }}.tgz \
            oci://ghcr.io/${OWNER}/charts
