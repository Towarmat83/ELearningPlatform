apiVersion: v1
kind: Service
metadata:
  name: {{ include "elearning.fullname" . }}-user-service
  labels:
    {{- include "elearning.userService.labels" . | nindent 4 }}
spec:
  type: {{ .Values.userService.service.type }}
  ports:
    - port: {{ .Values.userService.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "elearning.userService.selectorLabels" . | nindent 4 }}
