jwtSecret: "test-jwt-secret-for-kind-cluster-min-32-chars!!"

courseService:
  image:
    repository: localhost/pupitre-course-service
    tag: local
    pullPolicy: Never
  service:
    type: NodePort
    port: 8082
    nodePort: 30082
  extraEnv:
    # Seeds the demo catalogue on startup so a fresh cluster is browsable.
    # "true" only creates the courses that are missing; use "overwrite" to
    # replace them after editing course-service/internal/db/seed/courses/.
    - name: SEED_DEV_COURSES
      value: "true"

checkerService:
  image:
    repository: localhost/pupitre-checker-service
    tag: local
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 8083
  gitLabToken: ""
  env:
    GITLAB_BASE_URL: "http://gitlab.local:8880"

userService:
  image:
    repository: localhost/pupitre-user-service
    tag: local
    pullPolicy: Never
  service:
    type: NodePort
    port: 8081
    nodePort: 30081

frontend:
  image:
    repository: localhost/pupitre-frontend
    tag: local
    pullPolicy: Never
  service:
    type: NodePort
    port: 3000
    nodePort: 30080

sso:
  enabled: true
  redirectBase: "http://localhost:3000"
  providers:
    - id: github
      name: GitHub
      clientId: "Iv23lio9LgGJ8blbGG7e"
      clientSecret: "c8465a66ca28b389a2810ff116f44c97a35b6ae9"

ingress:
  enabled: false
  host: localhost:3000

postgresql:
  enabled: true
  auth:
    username: pupitre
    password: pupitre_secret
    database: pupitre
  persistence:
    enabled: false
