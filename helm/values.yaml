# ─────────────────────────────────────────────────────────────────────────────
# eLearning Platform — Helm Values
# Override any value with: helm upgrade --set key=value ...
# ─────────────────────────────────────────────────────────────────────────────

# Shared JWT secret (must match between services)
jwtSecret: "change-me-in-production-use-a-long-random-string"

# ── Admin account bootstrap ──────────────────────────────────────────────────
# The user-service seeds the admin account on startup (idempotent).
# Three modes (evaluated in this order):
#
# Mode 1 — auto-generated (default, recommended):
#   admin:
#     password: ""   ← leave empty; a random 32-char password is generated
#                       on first install and persisted in the platform Secret.
#                       Retrieve it after install with:
#                         kubectl get secret <release>-secrets -o jsonpath='{.data.ADMIN_PASSWORD}' | base64 -d
#
# Mode 2 — explicit inline password:
#   admin:
#     password: "MyStr0ngPassw0rd!"
#
# Mode 3 — existing K8s Secret (Vault / External Secrets / SOPS):
#   admin:
#     existingSecret: "my-admin-secret"
#     existingSecretKey: "ADMIN_PASSWORD"
#
# The value may be cleartext or a pre-computed bcrypt hash
# (auto-detected: values starting with "$2" are treated as already hashed).
# On password change the hash is refreshed on the next pod restart (no SQL needed).
admin:
  password: ""               # leave empty to auto-generate on first install
  existingSecret: ""         # if set, modes 1 & 2 are ignored
  existingSecretKey: "ADMIN_PASSWORD"

# ── Course Service (Go, stateless) ──────────────────────────────────────────
courseService:
  replicaCount: 1
  image:
    repository: ghcr.io/towarmat83/elearning-course-service
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env:
    JWT_EXPIRY_HOURS: "24"
    CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    UPLOADS_DIR: "/data/uploads"
    K8S_NAMESPACE: "default"
    GIT_CACHE_TTL: "10"
    GIT_CREDENTIALS_PATH: "/etc/git-credentials/git-credentials.yaml"
    GIT_TOKEN: ""
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}

# ── User Service (Go, PostgreSQL) ───────────────────────────────────────────
userService:
  replicaCount: 1
  image:
    repository: ghcr.io/towarmat83/elearning-user-service
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    JWT_EXPIRY_HOURS: "24"
    CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}

# ── Frontend (SvelteKit) ────────────────────────────────────────────────────
frontend:
  image:
    repository: ghcr.io/towarmat83/elearning-frontend
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env:
    NODE_ENV: "production"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# ── SSO / OAuth providers (optionnel) ────────────────────────────────────────
# Chaque provider est un objet générique.
# Providers OIDC (GitLab, Google, Authentik, Keycloak, …) : fournir issuer_url.
# GitHub (OAuth2 pur, pas OIDC) : id: github, pas de issuer_url.
# Exemples :
#   providers:
#     - id: gitlab
#       name: GitLab
#       client_id: "xxx"
#       client_secret: "yyy"
#       issuer_url: "https://gitlab.com"        # optionnel, self-hosted
#     - id: github
#       name: GitHub
#       client_id: "aaa"
#       client_secret: "bbb"
#     - id: google
#       name: Google
#       client_id: "..."
#       client_secret: "..."
#       issuer_url: "https://accounts.google.com"
#     - id: company-sso
#       name: "Company SSO"
#       client_id: "..."
#       client_secret: "..."
#       issuer_url: "https://sso.company.com"
sso:
  enabled: false
  redirectBase: ""        # defaults to ingress public URL when empty
  providers: []

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: elearning.local
      paths:
        - path: /api/auth
          pathType: Prefix
          backend: user-service
        - path: /api/settings
          pathType: Prefix
          backend: user-service
        - path: /api/my
          pathType: Prefix
          backend: user-service
        - path: /api/admin/courses
          pathType: Prefix
          backend: course-service
        - path: /api/admin
          pathType: Prefix
          backend: user-service
        - path: /api/courses
          pathType: Prefix
          backend: course-service
        - path: /uploads
          pathType: Prefix
          backend: course-service
        - path: /health
          pathType: Exact
          backend: course-service
        - path: /metrics
          pathType: Prefix
          backend: course-service
        - path: /
          pathType: Prefix
          backend: frontend
  tls: []

# ── PostgreSQL (optionnel — image officielle postgres:17-alpine) ─────────────
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  auth:
    username: elearning
    password: elearning_secret
    database: elearning
    existingSecret: ""         # if set, POSTGRES_PASSWORD is read from this K8s secret
    existingSecretKey: "db_password"
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

externalDatabase:
  host: "elearning-postgresql"
  port: 5432
  name: elearning
  username: elearning
  password: "elearning_secret"
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

