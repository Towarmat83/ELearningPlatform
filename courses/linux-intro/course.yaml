apiVersion: elearning.example.com/v1
kind: Course
metadata:
  name: linux-intro
spec:
  title: "Introduction to Linux"
  description: "Apprends les bases de Linux : navigation, gestion de fichiers et permissions. Un cours pratique pour démarrer sur la bonne voie."
  category: linux
  difficulty: beginner
  hidden: false
  modules:
    - name: "Qu'est-ce que Linux ?"
      type: text
      src: "https://github.com/Towarmat83/ELearningPlatform"
      ref: "feature(#19)/suivi-progression"
      path: "courses/linux-intro/01-what-is-linux.md"

    - name: "Quiz Bases Linux"
      type: quiz
      src: "https://github.com/Towarmat83/ELearningPlatform"
      ref: "feature(#19)/suivi-progression"
      path: "courses/linux-intro/quizzes/quiz-bases-linux.yaml"
      prerequisites:
        - "qu-est-ce-que-linux"

    - name: "Naviguer dans le système de fichiers"
      type: text
      src: "https://github.com/Towarmat83/ELearningPlatform"
      ref: "feature(#19)/suivi-progression"
      path: "courses/linux-intro/02-navigation.md"
      prerequisites:
        - "quiz-bases-linux"

    - name: "Quiz Navigation"
      type: quiz
      src: "https://github.com/Towarmat83/ELearningPlatform"
      ref: "feature(#19)/suivi-progression"
      path: "courses/linux-intro/quizzes/quiz-navigation.yaml"
      prerequisites:
        - "naviguer-dans-le-système-de-fichiers"

    - name: "Fichiers, permissions et utilisateurs"
      type: text
      src: "https://github.com/Towarmat83/ELearningPlatform"
      ref: "feature(#19)/suivi-progression"
      path: "courses/linux-intro/03-files.md"
      prerequisites:
        - "quiz-navigation"

    - name: "Quiz Fichiers et Permissions"
      type: quiz
      src: "https://github.com/Towarmat83/ELearningPlatform"
      ref: "feature(#19)/suivi-progression"
      path: "courses/linux-intro/quizzes/quiz-fichiers-permissions.yaml"
      prerequisites:
        - "fichiers--permissions-et-utilisateurs"

    - name: "Quiz Final Linux"
      type: quiz
      src: "https://github.com/Towarmat83/ELearningPlatform"
      ref: "feature(#19)/suivi-progression"
      path: "courses/linux-intro/quizzes/quiz-final-linux.yaml"
      prerequisites:
        - "quiz-bases-linux"
        - "quiz-navigation"
        - "quiz-fichiers-et-permissions"
