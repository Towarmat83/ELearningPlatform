id: quiz-bases-linux
title: "Quiz Bases Linux"
passing_score: 60
questions:
  - id: q1
    type: single
    points: 2
    question: "Quel est le rôle principal du noyau (kernel) Linux ?"
    answers:
      - id: a
        text: "Gérer les applications utilisateur"
        correct: false
      - id: b
        text: "Faire l'interface entre le matériel et les logiciels"
        correct: true
      - id: c
        text: "Afficher l'interface graphique"
        correct: false
      - id: d
        text: "Sauvegarder les fichiers sur le disque"
        correct: false
    feedback:
      correct: "Exact ! Le noyau est le cœur du système, il gère les ressources matérielles."
      wrong: "Le noyau est le composant central qui fait le lien entre le matériel et les logiciels."

  - id: q2
    type: multiple
    points: 2
    question: "Parmi ces systèmes, lesquels sont basés sur Linux ?"
    answers:
      - id: a
        text: "Ubuntu"
        correct: true
      - id: b
        text: "Windows 11"
        correct: false
      - id: c
        text: "Debian"
        correct: true
      - id: d
        text: "macOS"
        correct: false
    feedback:
      correct: "Bien joué ! Ubuntu et Debian sont des distributions Linux."
      wrong: "Ubuntu et Debian sont des distributions Linux. Windows et macOS sont des systèmes distincts."

  - id: q3
    type: boolean
    points: 1
    question: "Linux est un logiciel open source dont le code source est librement accessible."
    correct_answer: true
    feedback:
      correct: "Exact ! Linux est distribué sous licence GPL et son code est public."
      wrong: "Linux est bien open source, son code est disponible sur kernel.org."

  - id: q4
    type: single
    points: 2
    question: "Qu'est-ce que le terminal (ou console) sous Linux ?"
    answers:
      - id: a
        text: "Un type de matériel pour afficher des images"
        correct: false
      - id: b
        text: "Une interface en ligne de commande pour interagir avec le système"
        correct: true
      - id: c
        text: "Un éditeur de texte graphique"
        correct: false
      - id: d
        text: "Un gestionnaire de paquets"
        correct: false
    feedback:
      correct: "Correct ! Le terminal permet d'envoyer des commandes textuelles au système."
      wrong: "Le terminal est une interface textuelle permettant d'exécuter des commandes."

  - id: q5
    type: single
    points: 2
    question: "Quel composant permet à l'utilisateur d'interagir avec le noyau Linux via des commandes textuelles ?"
    answers:
      - id: a
        text: "L'interface graphique (GUI)"
        correct: false
      - id: b
        text: "Le shell"
        correct: true
      - id: c
        text: "Le navigateur web"
        correct: false
      - id: d
        text: "La RAM"
        correct: false
    feedback:
      correct: "Exact ! Le shell (bash, zsh…) interprète les commandes et les transmet au noyau."
      wrong: "C'est le shell (ex: bash) qui traduit les commandes texte en appels système."
