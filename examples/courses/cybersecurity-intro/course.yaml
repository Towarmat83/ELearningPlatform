apiVersion: elearning.example.com/v1
kind: Course
metadata:
  name: cybersecurity-intro
spec:
  title: "Introduction à la cybersécurité"
  description: "Découvre les bases de la cybersécurité : OWASP Top 10, gestion des identités, chiffrement et bonnes pratiques de sécurité applicative. Indispensable pour tout développeur."
  category: security
  difficulty: intermediate
  public: true
  prerequisites:
    - course: "networking-essentials"
  modules:
    - name: "Les menaces du web"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/01-intro.md"
    - name: "OWASP Top 10"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/02-images.md"
      prerequisites:
        - "les-menaces-du-web"
    - name: "Authentification et gestion des sessions"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/03-networking.md"
      prerequisites:
        - "owasp-top-10"
    - name: "Chiffrement et cryptographie"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/04-compose.md"
      prerequisites:
        - "authentification-et-gestion-des-sessions"
    - name: "Quiz Cybersécurité"
      type: "quiz"
      inline: true
      prerequisites:
        - "les-menaces-du-web"
        - "owasp-top-10"
        - "authentification-et-gestion-des-sessions"
        - "chiffrement-et-cryptographie"
      passing_score: 75
      questions:
        - text: "Quelle attaque consiste à injecter du SQL dans un formulaire ?"
          answers:
            - text: "SQL Injection"
              correct: true
            - text: "XSS"
              correct: false
            - text: "CSRF"
              correct: false
            - text: "Buffer Overflow"
              correct: false
        - text: "Que signifie HTTPS ?"
          answers:
            - text: "HyperText Transfer Protocol Secure"
              correct: true
            - text: "High Transfer Protocol Standard"
              correct: false
            - text: "HyperText Transport Protocol Safe"
              correct: false
            - text: "Hosted Transfer Protocol Security"
              correct: false
        - text: "Quelle méthode de hachage est recommandée pour les mots de passe ?"
          answers:
            - text: "bcrypt"
              correct: true
            - text: "MD5"
              correct: false
            - text: "SHA-1"
              correct: false
            - text: "Base64"
              correct: false
