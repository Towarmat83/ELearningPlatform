id: quiz-final-linux
title: "Quiz Final Linux"
passing_score: 70
questions:
  - id: q1
    type: single
    points: 2
    question: "Qui a créé le noyau Linux en 1991 ?"
    answers:
      - id: a
        text: "Bill Gates"
        correct: false
      - id: b
        text: "Linus Torvalds"
        correct: true
      - id: c
        text: "Steve Jobs"
        correct: false
      - id: d
        text: "Richard Stallman"
        correct: false
    feedback:
      correct: "Exact ! Linus Torvalds a créé Linux en 1991 alors qu'il était étudiant."
      wrong: "C'est Linus Torvalds qui a créé le noyau Linux en 1991."

  - id: q2
    type: single
    points: 2
    question: "Quelle commande permet d'afficher le contenu d'un répertoire ?"
    answers:
      - id: a
        text: "cat"
        correct: false
      - id: b
        text: "ls"
        correct: true
      - id: c
        text: "pwd"
        correct: false
      - id: d
        text: "find"
        correct: false
    feedback:
      correct: "Exact ! 'ls' liste le contenu d'un répertoire."
      wrong: "'ls' (list) affiche le contenu du répertoire courant ou d'un chemin donné."

  - id: q3
    type: single
    points: 3
    question: "La notation rwxr-xr-- correspond à quelle valeur octale ?"
    answers:
      - id: a
        text: "755"
        correct: false
      - id: b
        text: "744"
        correct: false
      - id: c
        text: "754"
        correct: true
      - id: d
        text: "777"
        correct: false
    feedback:
      correct: "Exact ! rwx=7, r-x=5, r--=4 → 754."
      wrong: "rwx=7 (4+2+1), r-x=5 (4+0+1), r--=4 (4+0+0) → 754."

  - id: q4
    type: multiple
    points: 3
    question: "Lesquels de ces répertoires font partie de l'arborescence Linux standard ?"
    answers:
      - id: a
        text: "/etc"
        correct: true
      - id: b
        text: "/home"
        correct: true
      - id: c
        text: "/windows"
        correct: false
      - id: d
        text: "/var"
        correct: true
    feedback:
      correct: "Parfait ! /etc, /home et /var sont des répertoires standards Linux (FHS)."
      wrong: "/etc (configuration), /home (utilisateurs), /var (données variables) sont des standards."

  - id: q5
    type: boolean
    points: 1
    question: "La commande 'cp -r' permet de copier un répertoire et tout son contenu récursivement."
    correct_answer: true
    feedback:
      correct: "Exact ! Le flag '-r' (recursive) est nécessaire pour copier des dossiers."
      wrong: "Oui, '-r' rend la copie récursive, ce qui est nécessaire pour les dossiers."

  - id: q6
    type: single
    points: 2
    question: "Quel fichier système contient la liste des comptes utilisateurs Linux ?"
    answers:
      - id: a
        text: "/etc/shadow"
        correct: false
      - id: b
        text: "/etc/group"
        correct: false
      - id: c
        text: "/etc/passwd"
        correct: true
      - id: d
        text: "/etc/users"
        correct: false
    feedback:
      correct: "Exact ! /etc/passwd contient les informations de base des utilisateurs."
      wrong: "/etc/passwd contient la liste des utilisateurs (les mots de passe hashés sont dans /etc/shadow)."

  - id: q7
    type: order
    points: 3
    question: "Classez ces commandes dans le bon ordre pour créer un utilisateur et lui donner les droits sudo."
    items:
      - id: adduser
        text: "sudo adduser john"
      - id: usermod
        text: "sudo usermod -aG sudo john"
      - id: switch
        text: "su - john"
    correct_order:
      - adduser
      - usermod
      - switch
    feedback:
      correct: "Parfait ! On crée l'utilisateur, on lui ajoute le groupe sudo, puis on change de session."
      wrong: "Il faut d'abord créer le compte (adduser), ajouter le groupe sudo (usermod), puis basculer (su)."

  - id: q8
    type: single
    points: 2
    question: "Que signifie l'acronyme POSIX ?"
    answers:
      - id: a
        text: "Portable Operating System Interface"
        correct: true
      - id: b
        text: "Professional Open Source Interface eXtended"
        correct: false
      - id: c
        text: "Process and Open Secure Information eXchange"
        correct: false
      - id: d
        text: "Platform Operating System for Internet eXchange"
        correct: false
    feedback:
      correct: "Exact ! POSIX définit les standards de compatibilité des systèmes Unix-like."
      wrong: "POSIX = Portable Operating System Interface, un standard de compatibilité Unix."
