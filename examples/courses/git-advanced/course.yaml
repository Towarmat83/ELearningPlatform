apiVersion: elearning.example.com/v1
kind: Course
metadata:
  name: git-advanced
spec:
  title: "Git avancé et workflows"
  description: "Va au-delà du git commit : rebase interactif, gestion des branches, GitFlow, hooks et collaboration en équipe. Pour les développeurs qui veulent maîtriser leur historique."
  category: devops
  difficulty: intermediate
  public: false
  modules:
    - name: "Rappels Git essentiels"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/01-intro.md"
    - name: "Branches et stratégies de fusion"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/02-images.md"
      prerequisites:
        - "rappels-git-essentiels"
    - name: "Rebase interactif"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/03-networking.md"
      prerequisites:
        - "branches-et-stratégies-de-fusion"
    - name: "GitFlow et trunk-based development"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/04-compose.md"
      prerequisites:
        - "rebase-interactif"
    - name: "Hooks et automatisation"
      type: "text"
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/04-compose.md"
      prerequisites:
        - "gitflow-et-trunk-based-development"
    - name: "Quiz Git Avancé"
      type: "quiz"
      inline: true
      prerequisites:
        - "rappels-git-essentiels"
        - "branches-et-stratégies-de-fusion"
        - "rebase-interactif"
        - "gitflow-et-trunk-based-development"
        - "hooks-et-automatisation"
      passing_score: 80
      questions:
        - text: "Quelle commande permet de réécrire l'historique des 3 derniers commits ?"
          answers:
            - text: "git rebase -i HEAD~3"
              correct: true
            - text: "git reset HEAD~3"
              correct: false
            - text: "git amend -3"
              correct: false
            - text: "git rewrite HEAD~3"
              correct: false
        - text: "Dans GitFlow, quelle branche reçoit les hotfixes ?"
          answers:
            - text: "main et develop"
              correct: true
            - text: "feature"
              correct: false
            - text: "release"
              correct: false
            - text: "staging"
              correct: false
        - text: "Quel fichier configure les hooks côté client ?"
          answers:
            - text: ".git/hooks/"
              correct: true
            - text: ".gitconfig"
              correct: false
            - text: ".githooks"
              correct: false
            - text: "hooks.yaml"
              correct: false
