apiVersion: elearning.example.com/v1
kind: Course
metadata:
  name: quiz-blockage-test
spec:
  title: "Test — Blocage des Quiz"
  description: |
    Cours de test pour valider la feature de blocage (lock_on_max_attempts).
    Contient trois quiz inline avec des configurations de blocage différentes :
      - Quiz 1 : blocage strict (2 tentatives max, puis verrou définitif)
      - Quiz 2 : cooldown exponentiel sans blocage permanent
      - Quiz 3 : blocage + prérequis (le Quiz 1 doit être réussi d'abord)
  category: "internal-testing"
  difficulty: "beginner"
  public: true

  modules:

    # ── Module 1 : texte d'introduction ────────────────────────────────────────
    - name: "Introduction au blocage"
      type: text
      src: "https://github.com/paulmascarilla/course-example"
      ref: "main"
      path: "lessons/01-intro.md"

    # ── Module 2 : Quiz avec blocage strict ─────────────────────────────────────
    # Scénario : 2 tentatives par question, puis le module est verrouillé.
    # But : vérifier que le flag "locked: true" est bien retourné par l'API
    # et que le frontend affiche l'état bloqué.
    - name: "Quiz Blocage Strict"
      type: quiz
      max_attempts_per_question: 2
      lock_on_max_attempts: true
      passing_score: 100
      cooldown:
        strategy: exponential
        base_seconds: 10
        multiplier: 2.0
        max_seconds: 60
      questions:
        - id: q1
          type: single
          difficulty: easy
          points: 1
          question: "Quelle commande affiche le répertoire courant sous Linux ?"
          answers:
            - id: a
              text: "pwd"
              correct: true
            - id: b
              text: "ls"
              correct: false
            - id: c
              text: "cd"
              correct: false
          feedback:
            wrong: "Ce n'est pas la bonne commande. (max 2 tentatives — module bloqué ensuite)"
            correct: "Correct ! `pwd` affiche le chemin absolu du répertoire courant."

        - id: q2
          type: boolean
          difficulty: easy
          points: 1
          question: "La commande `rm -rf /` supprime uniquement le répertoire courant."
          correct_answer: false
          feedback:
            wrong: "Attention ! `rm -rf /` supprime la racine entière du système."
            correct: "Exact — cette commande est extrêmement destructrice."

    # ── Module 3 : Quiz avec cooldown seulement (pas de blocage permanent) ──────
    # Scénario : 3 tentatives, cooldown croissant, mais PAS de verrou définitif.
    # But : distinguer "cooldown actif" de "module verrouillé".
    - name: "Quiz Cooldown Sans Blocage"
      type: quiz
      max_attempts_per_question: 3
      lock_on_max_attempts: false
      passing_score: 50
      cooldown:
        strategy: exponential
        base_seconds: 5
        multiplier: 3.0
        max_seconds: 120
      prerequisites:
        - "introduction-au-blocage"
      questions:
        - id: q1
          type: single
          difficulty: easy
          points: 1
          question: "Combien de bits compose un octet ?"
          answers:
            - id: a
              text: "4"
              correct: false
            - id: b
              text: "8"
              correct: true
            - id: c
              text: "16"
              correct: false
          feedback:
            wrong: "Réessayez — il y a un cooldown mais pas de blocage définitif."
            correct: "Exact ! 1 octet = 8 bits."

        - id: q2
          type: multiple
          difficulty: medium
          points: 2
          question: "Quels protocoles fonctionnent sur la couche Transport du modèle OSI ?"
          answers:
            - id: a
              text: "TCP"
              correct: true
            - id: b
              text: "HTTP"
              correct: false
            - id: c
              text: "UDP"
              correct: true
            - id: d
              text: "IP"
              correct: false
          partial_scoring:
            enabled: true
            allow_negative: false
          feedback:
            wrong: "HTTP est applicatif, IP est réseau. TCP et UDP sont en couche Transport."
            correct: "Parfait ! TCP et UDP opèrent bien en couche 4."

    # ── Module 4 : Quiz final avec prérequis + blocage ──────────────────────────
    # Scénario : nécessite d'avoir complété "Quiz Blocage Strict" ET
    # "Quiz Cooldown Sans Blocage" avant d'accéder à ce module.
    # Blocage : 3 tentatives max, puis verrou.
    # But : tester l'enchaînement prérequis → accès → blocage.
    - name: "Quiz Final avec Prérequis"
      type: quiz
      max_attempts_per_question: 3
      lock_on_max_attempts: true
      passing_score: 75
      cooldown:
        strategy: exponential
        base_seconds: 15
        multiplier: 2.0
        max_seconds: 300
      prerequisites:
        - "quiz-blocage-strict"
        - "quiz-cooldown-sans-blocage"
      questions:
        - id: q1
          type: order
          difficulty: hard
          points: 3
          question: "Remettez dans l'ordre les couches du modèle OSI (de la plus basse à la plus haute)."
          items:
            - id: i1
              text: "Physique"
            - id: i2
              text: "Réseau"
            - id: i3
              text: "Transport"
            - id: i4
              text: "Application"
          correct_order: [i1, i2, i3, i4]
          feedback:
            wrong: "L'ordre est : Physique → Liaison → Réseau → Transport → Session → Présentation → Application."
            correct: "Exact ! Vous connaissez le modèle OSI."

        - id: q2
          type: single
          difficulty: medium
          points: 2
          question: "Quel protocole est utilisé pour attribuer dynamiquement des adresses IP ?"
          answers:
            - id: a
              text: "DNS"
              correct: false
            - id: b
              text: "DHCP"
              correct: true
            - id: c
              text: "ARP"
              correct: false
            - id: d
              text: "ICMP"
              correct: false
          feedback:
            wrong: "DNS résout les noms, ARP mappe IP↔MAC, ICMP diagnostique. C'est DHCP."
            correct: "Correct ! DHCP distribue les adresses IP automatiquement."
