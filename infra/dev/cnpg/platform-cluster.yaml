apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: platform-db
  namespace: elearning
spec:
  instances: 1
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: elearning
      owner: elearning
      # CNPG creates a secret named "platform-db-app" with keys:
      #   username, password, uri, host, port, dbname
      # The platform Helm chart reads this via database.auth.existingSecret
