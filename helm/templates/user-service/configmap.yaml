apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elearning.fullname" . }}-user-service-config
  labels:
    {{- include "elearning.userService.labels" . | nindent 4 }}
data:
  config.yaml: |
    port: {{ .Values.userService.service.port }}
    jwtExpiryHours: {{ .Values.userService.env.JWT_EXPIRY_HOURS }}
    corsOrigins:
      - "{{ include "elearning.publicUrl" . }}"
    courseServiceUrl: "http://{{ include "elearning.fullname" . }}-course-service.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:{{ .Values.courseService.service.port }}"
    oauthRedirectBase: {{ .Values.sso.redirectBase | default (include "elearning.publicUrl" .) | quote }}
    {{- if and .Values.sso.enabled .Values.sso.providers }}
    # Client secrets are deliberately omitted here — they are injected as
    # SSO_<ID>_CLIENT_SECRET env vars sourced from a Secret (see deployment.yaml).
    providers:
    {{- range .Values.sso.providers }}
      - id: {{ .id | quote }}
        name: {{ .name | quote }}
        {{- if .clientId }}
        clientId: {{ .clientId | quote }}
        {{- end }}
        {{- if .issuerUrl }}
        issuerUrl: {{ .issuerUrl | quote }}
        {{- end }}
    {{- end }}
    {{- end }}
