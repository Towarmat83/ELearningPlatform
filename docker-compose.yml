services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: elearning
      POSTGRES_USER: elearning
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elearning_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port non exposé à l'hôte pour éviter les conflits si PostgreSQL est déjà installé.
    # Décommentez si vous souhaitez accéder à la DB depuis l'hôte :
    # ports:
    #   - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elearning -d elearning"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://elearning:${DB_PASSWORD:-elearning_secret}@postgres:5432/elearning
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-min-32-chars}
      CORS_ORIGINS: http://localhost:3000,${FRONTEND_URL:-http://localhost:3000}
      PORT: 8081
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@1234}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Note: course-service needs a Kubernetes cluster for the CRD watcher.
  # In docker-compose, the watcher will fail but HTTP endpoints remain functional
  # if KUBECONFIG is provided or the service is patched to skip K8s init.
  course-service:
    build:
      context: ./course-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production-min-32-chars}
      USER_SERVICE_URL: http://user-service:8081
      CORS_ORIGINS: http://localhost:3000,${FRONTEND_URL:-http://localhost:3000}
      PORT: 8082
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8082:8082"
    depends_on:
      - user-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      COURSE_API: http://course-service:8082
      USER_API: http://user-service:8081
      PORT: 3000
      ORIGIN: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - course-service
      - user-service
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  uploads_data:
  prometheus_data:
  grafana_data:
