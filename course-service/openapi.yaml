openapi: "3.1.0"
info:
  title: Course Service
  description: Stateless micro-service for course/module content delivery.
  version: "1.0.0"
servers:
  - url: http://localhost:8082
    description: Local development

paths:
  /health:
    get:
      summary: Liveness check
      operationId: health
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: course-service
                  version:
                    type: string
                    example: 1.0.0

  /metrics:
    get:
      summary: Prometheus metrics
      operationId: metrics
      responses:
        "200":
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string

  /api/courses:
    get:
      summary: List published courses
      operationId: listCourses
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter by category
        - name: difficulty
          in: query
          required: false
          schema:
            type: string
          description: Filter by difficulty
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search in title and description
      responses:
        "200":
          description: List of published courses
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      $ref: "#/components/schemas/Course"
                  total:
                    type: integer

  /api/courses/{slug}:
    get:
      summary: Get a single course
      operationId: getCourse
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Course details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/courses/{slug}/modules:
    get:
      summary: List modules for a course
      operationId: listModules
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of modules with viewed status
          content:
            application/json:
              schema:
                type: object
                properties:
                  modules:
                    type: array
                    items:
                      $ref: "#/components/schemas/Module"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/courses/{slug}/modules/{index}:
    get:
      summary: Get a single module with content
      operationId: getModule
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Module details including content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/courses/{slug}/labs:
    get:
      summary: List course modules as labs
      operationId: listLabs
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of labs
          content:
            application/json:
              schema:
                type: object
                properties:
                  labs:
                    type: array
                    items:
                      $ref: "#/components/schemas/Lab"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/courses/{slug}/labs/{lab_id}:
    get:
      summary: Get a single lab
      operationId: getLab
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: lab_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lab detail with progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  lab:
                    $ref: "#/components/schemas/Lab"
                  progress:
                    type: object
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/courses/{slug}/progress:
    get:
      summary: Get course progress
      operationId: getCourseProgress
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Course progress stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/courses/{slug}/lessons:
    get:
      summary: List lessons for a course
      operationId: listLessons
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of lessons with viewed status
          content:
            application/json:
              schema:
                type: object
                properties:
                  lessons:
                    type: array
                    items:
                      $ref: "#/components/schemas/LessonSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/courses/{slug}/lessons/{lessonSlug}:
    get:
      summary: Get a lesson with full content
      operationId: getLesson
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: lessonSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lesson details including content
          content:
            application/json:
              schema:
                type: object
                properties:
                  lesson:
                    $ref: "#/components/schemas/LessonDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/courses/{slug}/lessons/{lessonSlug}/complete:
    post:
      summary: Mark a lesson as complete
      operationId: markLessonComplete
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: lessonSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lesson marked as complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Lesson marked as complete
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/admin/courses:
    get:
      summary: List all courses including hidden (admin)
      operationId: listAdminCourses
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of all courses
          content:
            application/json:
              schema:
                type: object
                properties:
                  courses:
                    type: array
                    items:
                      $ref: "#/components/schemas/Course"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/courses/import:
    post:
      summary: Create or update a course from a markdown document (admin)
      operationId: importCourseMarkdown
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseImportRequest"
      responses:
        "200":
          description: Course updated (replace or append)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportResult"
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseImportResult"
        "400":
          description: The document could not be parsed, or the options are invalid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: replace/append named a course that does not exist
        "409":
          description: create named a slug that is already taken

  /api/admin/courses/import/preview:
    post:
      summary: Preview what a markdown document would import (admin)
      description: >
        Resolves the document exactly as the import endpoint would — including
        the conflict and not-found checks — but writes nothing.
      operationId: previewCourseMarkdownImport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseImportRequest"
      responses:
        "200":
          description: What the document would produce
          content:
            application/json:
              schema:
                type: object
                properties:
                  slug:
                    type: string
                  mode:
                    type: string
                  course:
                    type: object
                    description: The course's own fields, without its modules
                  modules:
                    type: array
                    items:
                      $ref: "#/components/schemas/ImportModuleSummary"
                  warnings:
                    type: array
                    items:
                      type: string
        "400":
          description: The document could not be parsed, or the options are invalid
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: replace/append named a course that does not exist
        "409":
          description: create named a slug that is already taken

  /api/admin/courses/{slug}/export/markdown:
    get:
      summary: Export a course as a markdown document (admin)
      description: >
        Renders the stored course as the document the import endpoint reads
        back into the same definition.
      operationId: exportCourseMarkdown
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: split
          in: query
          required: false
          description: >
            Heading level to write each module under. Omitted, the exporter
            picks a level no module body already uses.
          schema:
            type: string
            enum: [h1, h2, h3, h4, h5, h6]
      responses:
        "200":
          description: The course as markdown
          content:
            text/markdown:
              schema:
                type: string
        "400":
          description: Invalid split level
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /uploads/{filename}:
    get:
      summary: Serve an uploaded media file
      operationId: serveUpload
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File contents
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid filename

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CourseImportRequest:
      type: object
      required: [markdown]
      properties:
        markdown:
          type: string
          description: The whole document, frontmatter included.
          example: |
            ---
            title: Introduction to Linux
            category: linux
            ---

            ## What is Linux

            A kernel.
        slug:
          type: string
          description: Overrides the slug the document's frontmatter declares.
        split:
          type: string
          description: >
            Heading level that starts a new module. Omitted, the document's
            own `split` key is used, then `none`.
          enum: [none, h1, h2, h3, h4, h5, h6]
        mode:
          type: string
          description: >
            create refuses an existing slug; replace swaps the course's
            modules for the document's; append adds them after the existing
            ones. Defaults to create.
          enum: [create, replace, append]
          default: create

    CourseImportResult:
      type: object
      properties:
        slug:
          type: string
        mode:
          type: string
        moduleCount:
          type: integer
        warnings:
          type: array
          items:
            type: string
          description: What the importer chose to ignore, if anything.

    ImportModuleSummary:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        type:
          type: string
        bytes:
          type: integer
          description: Length of the module's inline markdown body.
        hidden:
          type: boolean
        src:
          type: string
        path:
          type: string
        existing:
          type: boolean
          description: The module was already stored and is being kept (append).

    Course:
      type: object
      properties:
        slug:
          type: string
          example: kubernetes-basics
        id:
          type: string
          example: kubernetes-basics
        title:
          type: string
          example: Kubernetes Basics
        description:
          type: string
          example: Learn the fundamentals of Kubernetes
        category:
          type: string
          example: kubernetes
        difficulty:
          type: string
          example: beginner
        isPublished:
          type: boolean
        module_count:
          type: integer
        labCount:
          type: integer
        enrollmentCount:
          type: integer
        source:
          type: string
          example: k8s:kubernetes-basics

    Module:
      type: object
      properties:
        index:
          type: integer
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum: [video, text, image]
        viewed:
          type: boolean
        replication:
          type: boolean
          description: When true, video/image resources are downloaded and served locally via /uploads/

    ModuleDetail:
      allOf:
        - $ref: "#/components/schemas/Module"
        - type: object
          properties:
            content:
              type: string
              description: URL for video/image, markdown body for text

    Lab:
      type: object
      properties:
        id:
          type: string
        courseId:
          type: string
        title:
          type: string
        description:
          type: string
        labType:
          type: string
          enum: [form, interactive]
        points:
          type: integer
        orderIndex:
          type: integer
        isPublished:
          type: boolean

    LessonSummary:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        order:
          type: integer
        viewed:
          type: boolean

    LessonDetail:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        order:
          type: integer
        content:
          type: string
        viewed:
          type: boolean

    CourseProgress:
      type: object
      properties:
        courseId:
          type: string
        userId:
          type: string
        total_labs:
          type: integer
        completedLabs:
          type: integer
        total_points_possible:
          type: integer
        total_points_earned:
          type: integer
        completion_percentage:
          type: integer
        lab_progress:
          type: array
          items:
            type: object

  responses:
    Unauthorized:
      description: Missing or invalid JWT
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Missing Authorization header
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Course not found
