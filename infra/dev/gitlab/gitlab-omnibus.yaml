---
apiVersion: v1
kind: Namespace
metadata:
  name: gitlab
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitlab-data
  namespace: gitlab
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab
  namespace: gitlab
  labels:
    app: gitlab
spec:
  replicas: 1
  strategy:
    type: Recreate   # PVC is ReadWriteOnce — kill old pod before starting new
  selector:
    matchLabels:
      app: gitlab
  template:
    metadata:
      labels:
        app: gitlab
    spec:
      # GitLab Omnibus takes 3-5 min to start — give it time
      terminationGracePeriodSeconds: 60
      containers:
      - name: gitlab
        image: gitlab/gitlab-ce:latest   # ARM64 multi-arch added in 17.2+
        env:
        - name: GITLAB_KEYCLOAK_SECRET
          valueFrom:
            secretKeyRef:
              name: gitlab-keycloak-oidc
              key: client-secret
        - name: GITLAB_OMNIBUS_CONFIG
          value: |
            external_url 'http://gitlab.local:8880'
            nginx['listen_port'] = 80
            nginx['listen_https'] = false
            gitlab_rails['gitlab_shell_ssh_port'] = 2222
            # Disable email in dev
            gitlab_rails['smtp_enable'] = false
            gitlab_rails['gitlab_email_enabled'] = false
            # Speed up first start
            puma['worker_processes'] = 2
            sidekiq['concurrency'] = 5
            # Reduce memory usage
            prometheus_monitoring['enable'] = false
            alertmanager['enable'] = false
            node_exporter['enable'] = false
            redis_exporter['enable'] = false
            postgres_exporter['enable'] = false
            pgbouncer_exporter['enable'] = false

            # ── Keycloak SSO (OIDC) ──────────────────────────────────────────
            # Split-horizon: browser uses keycloak.local:8884 (external NodePort);
            # server-to-server (token exchange, JWKS) uses the internal k8s service.
            # `discovery: false` avoids GitLab trying to reach keycloak.local from the pod.
            gitlab_rails['omniauth_enabled'] = true
            gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
            gitlab_rails['omniauth_sync_email_from_provider'] = 'openid_connect'
            gitlab_rails['omniauth_sync_profile_from_provider'] = ['openid_connect']
            gitlab_rails['omniauth_block_auto_created_users'] = false
            gitlab_rails['omniauth_providers'] = [
              {
                'name' => 'openid_connect',
                'label' => 'Sign in with WKS',
                'args' => {
                  'name'             => 'openid_connect',
                  'scope'            => ['openid', 'profile', 'email'],
                  'response_type'    => 'code',
                  'discovery'        => false,
                  'uid_field'        => 'preferred_username',
                  'client_auth_method' => 'query',
                  # iss claim in tokens is set from the browser's auth request context
                  # (keycloak.local:8884), not from the internal token exchange URL
                  'issuer'           => 'http://keycloak.local:8884/realms/wks-main',
                  'client_options'   => {
                    'identifier'             => 'gitlab',
                    'secret'                 => ENV['GITLAB_KEYCLOAK_SECRET'],
                    'redirect_uri'           => 'http://gitlab.local:8880/users/auth/openid_connect/callback',
                    # browser-facing: accessed by the browser, not the GitLab pod
                    'authorization_endpoint' => 'http://keycloak.local:8884/realms/wks-main/protocol/openid-connect/auth',
                    # server-side: keycloak.local:8884 resolves via CoreDNS → keycloak-ext → pod:8080
                    # (HTTP, no SSL). Using the same host:port as the browser ensures the
                    # iss claim in tokens matches on both sides (strict=false uses request URL).
                    'token_endpoint'         => 'http://keycloak.local:8884/realms/wks-main/protocol/openid-connect/token',
                    'userinfo_endpoint'      => 'http://keycloak.local:8884/realms/wks-main/protocol/openid-connect/userinfo',
                    'jwks_uri'               => 'http://keycloak.local:8884/realms/wks-main/protocol/openid-connect/certs'
                  }
                }
              }
            ]
        ports:
        - name: http
          containerPort: 80
        - name: ssh
          containerPort: 22
        volumeMounts:
        - name: data
          mountPath: /var/opt/gitlab
          subPath: gitlab
        - name: data
          mountPath: /etc/gitlab
          subPath: config
        - name: data
          mountPath: /var/log/gitlab
          subPath: logs
        resources:
          requests:
            cpu: 500m
            memory: 3Gi
          limits:
            cpu: "4"
            memory: 6Gi
        # GitLab takes 3-5 min to be ready
        # TCP probes: simpler and arch-agnostic, avoids nginx Host-header routing issues
        startupProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 90
          periodSeconds: 15
          failureThreshold: 40   # up to ~10 min for first-boot DB migrations
        readinessProbe:
          tcpSocket:
            port: 80
          periodSeconds: 20
          failureThreshold: 5
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 180
          periodSeconds: 30
          failureThreshold: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: gitlab-data
---
# HTTP access → localhost:8880 via Kind port mapping 30880
apiVersion: v1
kind: Service
metadata:
  name: gitlab-http
  namespace: gitlab
spec:
  type: NodePort
  selector:
    app: gitlab
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30880
---
# SSH access → localhost:2222 via Kind port mapping 30022
apiVersion: v1
kind: Service
metadata:
  name: gitlab-ssh
  namespace: gitlab
spec:
  type: NodePort
  selector:
    app: gitlab
  ports:
  - name: ssh
    port: 22
    targetPort: 22
    nodePort: 30022
