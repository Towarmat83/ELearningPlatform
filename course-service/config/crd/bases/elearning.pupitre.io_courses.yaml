---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: courses.elearning.pupitre.io
spec:
  group: elearning.pupitre.io
  names:
    kind: Course
    listKind: CourseList
    plural: courses
    shortNames:
    - course
    singular: course
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.title
      name: Title
      type: string
    - jsonPath: .spec.category
      name: Category
      type: string
    - jsonPath: .spec.public
      name: Public
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Course is the Schema for the courses API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec defines the desired state of the Course.
            properties:
              badge:
                description: Badge defines the badge awarded on course completion.
                  Omitting it means no badge is granted.
                properties:
                  icon:
                    description: Icon is an emoji or short string used as the badge's
                      visual identifier.
                    type: string
                  name:
                    description: |-
                      Name is the flavor title of the badge (e.g. "Certified Operator").
                      The full badge name is displayed as "<Name> — <CourseTitle>".
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              category:
                description: Category groups the course for browsing/filtering purposes.
                type: string
              description:
                description: Description is a short summary of the course shown in
                  the catalog.
                type: string
              difficulty:
                default: beginner
                description: Difficulty labels the course's expected skill level.
                enum:
                - beginner
                - intermediate
                - advanced
                type: string
              hidden:
                description: 'Hidden: when true, the course is hidden from the catalog.'
                type: boolean
              inPerson:
                description: InPerson marks this course as available on-site, unlocking
                  the sessions schedule.
                type: boolean
              modules:
                description: Modules lists the course's content in display order.
                items:
                  description: Module is a course element as defined in spec.modules[].
                  properties:
                    checkParams:
                      description: CheckParams holds provider-specific parameters
                        for verifying this module.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    checkProvider:
                      description: CheckProvider selects the backend used to verify
                        lab-type module completion.
                      enum:
                      - local
                      - gitlab
                      type: string
                    checkType:
                      description: CheckType selects how the module as a whole is
                        verified (provider-specific).
                      type: string
                    content:
                      description: InlineContent is the module content provided directly
                        in the spec instead of fetched from git.
                      type: string
                    cooldown:
                      description: Cooldown configures the retry delay after a failed
                        quiz attempt.
                      properties:
                        baseSeconds:
                          description: BaseSeconds is the initial cooldown duration,
                            in seconds, after the first failed attempt.
                          minimum: 0
                          type: integer
                        maxSeconds:
                          description: MaxSeconds caps the cooldown duration regardless
                            of how many attempts have failed.
                          minimum: 0
                          type: integer
                        multiplier:
                          description: Multiplier scales BaseSeconds after each subsequent
                            failed attempt (exponential strategy only).
                          minimum: 0
                          type: number
                        strategy:
                          default: exponential
                          description: |-
                            Strategy is the backoff strategy applied between attempts: "fixed" keeps a
                            constant delay, "linear" grows the delay by BaseSeconds per attempt, and
                            "exponential" grows it by Multiplier per attempt (capped at MaxSeconds).
                          enum:
                          - fixed
                          - linear
                          - exponential
                          type: string
                      type: object
                    hidden:
                      description: Hidden hides this module from the course's navigation
                        while still allowing direct access.
                      type: boolean
                    inline:
                      description: 'Inline: when true (quiz type only), rendered inline
                        at the bottom of the previous module.'
                      type: boolean
                    labUrl:
                      description: LabURL is the URL of the lab environment for lab-type
                        modules.
                      type: string
                    lockOnMaxAttempts:
                      description: LockOnMaxAttempts locks the quiz once MaxAttemptsPerQuestion
                        is reached on any question.
                      type: boolean
                    maxAttemptsPerQuestion:
                      description: MaxAttemptsPerQuestion caps how many times a single
                        question can be retried.
                      minimum: 1
                      type: integer
                    name:
                      description: |-
                        Name is the module's display name; also used to derive its slug.
                        Auto-generated from the module's position if omitted.
                      type: string
                    passingScore:
                      description: PassingScore is the minimum percentage score required
                        to pass a quiz-type module.
                      maximum: 100
                      minimum: 0
                      type: integer
                    path:
                      description: Path is the file path within the git repository
                        holding this module's content.
                      type: string
                    prerequisites:
                      description: Prerequisites lists module slugs that must be completed
                        before this module unlocks.
                      items:
                        type: string
                      type: array
                    questions:
                      description: Questions lists the inline quiz questions for quiz-type
                        modules.
                      items:
                        description: Question is one inline quiz question of a quiz-type
                          module.
                        properties:
                          answers:
                            description: Answers lists the candidate answers for single/multiple-choice
                              questions.
                            items:
                              description: Answer is one candidate answer of a single/multiple-choice
                                question.
                              properties:
                                correct:
                                  description: Correct marks this answer as a correct
                                    choice.
                                  type: boolean
                                id:
                                  description: ID uniquely identifies this answer
                                    within its question.
                                  minLength: 1
                                  type: string
                                text:
                                  description: Text is the answer text shown to the
                                    user.
                                  minLength: 1
                                  type: string
                              required:
                              - id
                              - text
                              type: object
                            type: array
                          correctAnswer:
                            description: CorrectAnswer is the expected answer for
                              boolean questions.
                            type: boolean
                          correctOrder:
                            description: CorrectOrder lists the item IDs in their
                              correct order, for order-type questions.
                            items:
                              type: string
                            type: array
                          difficulty:
                            default: medium
                            description: Difficulty labels this question for display/filtering
                              purposes.
                            type: string
                          feedback:
                            description: Feedback holds the right/wrong messages shown
                              after answering.
                            properties:
                              correct:
                                description: Correct is the message shown when the
                                  answer is correct.
                                type: string
                              sourceRefs:
                                description: SourceRefs point back to the course material
                                  covering this question.
                                items:
                                  description: SourceRef points to the course/module/anchor
                                    backing a feedback message.
                                  properties:
                                    anchor:
                                      description: Anchor is an optional in-page anchor
                                        within the referenced module.
                                      type: string
                                    course:
                                      description: Course is the slug of the course
                                        this reference points to.
                                      type: string
                                    module:
                                      description: Module is the slug of the module
                                        this reference points to.
                                      type: string
                                    priority:
                                      description: Priority orders multiple source
                                        refs; lower values are shown first.
                                      minimum: 0
                                      type: integer
                                  type: object
                                type: array
                              wrong:
                                description: Wrong is the message shown when the answer
                                  is incorrect.
                                type: string
                            type: object
                          id:
                            description: |-
                              ID uniquely identifies this question within its module; auto-generated
                              from the question's position if omitted.
                            type: string
                          items:
                            description: Items lists the elements to be ordered for
                              order-type questions.
                            items:
                              description: OrderItem is one item of an ordering question.
                              properties:
                                id:
                                  description: ID uniquely identifies this item within
                                    its question.
                                  minLength: 1
                                  type: string
                                text:
                                  description: Text is the item text shown to the
                                    user.
                                  minLength: 1
                                  type: string
                              required:
                              - id
                              - text
                              type: object
                            type: array
                          partialScoring:
                            description: PartialScoring configures partial credit
                              for this question.
                            properties:
                              allowNegative:
                                description: AllowNegative allows the partial score
                                  to go below zero for this question.
                                type: boolean
                              enabled:
                                description: Enabled turns on partial credit for this
                                  question.
                                type: boolean
                            type: object
                          points:
                            default: 1
                            description: Points is how many points a correct answer
                              to this question is worth.
                            minimum: 0
                            type: integer
                          question:
                            description: Question is the question text shown to the
                              user.
                            minLength: 1
                            type: string
                          type:
                            description: Type is the question kind.
                            enum:
                            - single
                            - multiple
                            - boolean
                            - order
                            type: string
                        required:
                        - question
                        - type
                        type: object
                      type: array
                    quizRef:
                      description: QuizRef references an external quiz definition
                        instead of inline Questions.
                      type: string
                    ref:
                      description: Ref is the git branch, tag, or commit to fetch
                        content from.
                      type: string
                    replication:
                      description: Replication marks the content as safe to serve
                        from a per-user replicated copy.
                      type: boolean
                    skills:
                      description: Skills lists the competency tags this module teaches
                        (free-form, e.g. "docker", "ci-cd").
                      items:
                        type: string
                      type: array
                    src:
                      description: Src is the git repository URL (or direct URL for
                        video/image modules) this module's content is fetched from.
                      type: string
                    steps:
                      description: Steps lists the individually verifiable steps of
                        a lab-type module.
                      items:
                        description: CheckStep is one verifiable step inside a lab
                          module.
                        properties:
                          checkParams:
                            description: CheckParams holds provider-specific parameters
                              for verifying this step.
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                          checkType:
                            description: CheckType selects how this step is verified
                              (provider-specific).
                            minLength: 1
                            type: string
                          title:
                            description: Title is the human-readable name of this
                              step.
                            minLength: 1
                            type: string
                        required:
                        - checkType
                        - title
                        type: object
                      type: array
                    type:
                      default: text
                      description: Type selects how this module is rendered and consumed.
                      enum:
                      - video
                      - text
                      - image
                      - quiz
                      - lab
                      - modules
                      type: string
                  type: object
                type: array
              prerequisites:
                description: Prerequisites lists the conditions that must be met before
                  a user can enroll.
                items:
                  description: |-
                    CoursePrerequisite describes one condition that must be met before enrolling.
                    If only Course is set, enrollment in that course is required.
                    If MinScore > 0, the user must have earned at least that many total points.
                    If Modules is non-empty, every listed module slug must have been passed.
                  properties:
                    course:
                      description: Course is the slug of the course that must be completed
                        first.
                      minLength: 1
                      type: string
                    minScore:
                      description: MinScore is the minimum total quiz score (in points)
                        required in Course.
                      minimum: 0
                      type: integer
                    modules:
                      description: |-
                        Modules restricts the requirement to specific module slugs within Course,
                        instead of the whole course.
                      items:
                        type: string
                      type: array
                  required:
                  - course
                  type: object
                type: array
              public:
                description: 'Public: when true, the course is publicly visible and
                  users are auto-enrolled on first access.'
                type: boolean
              scope:
                description: Scope restricts enrollment management to users within
                  the named group.
                type: string
              sessions:
                description: Sessions lists the scheduled in-person sessions for this
                  course.
                items:
                  description: CourseSession describes one scheduled in-person session
                    of a course.
                  properties:
                    capacity:
                      description: Capacity is the maximum number of seats. 0 means
                        unlimited.
                      minimum: 0
                      type: integer
                    date:
                      description: Date is the start date and time of the session
                        in RFC3339 format.
                      minLength: 1
                      type: string
                    id:
                      description: ID uniquely identifies this session within the
                        course.
                      minLength: 1
                      type: string
                    location:
                      description: Location is the physical or virtual location of
                        the session.
                      type: string
                    title:
                      description: Title is the display name of this session.
                      minLength: 1
                      type: string
                  required:
                  - date
                  - id
                  - title
                  type: object
                type: array
              title:
                description: Title is the course's display name; defaults to the resource
                  name if omitted.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
