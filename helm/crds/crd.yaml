apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: markdownpatterns.elearning.example.com
spec:
  group: elearning.example.com
  names:
    kind: MarkdownPattern
    plural: markdownpatterns
    singular: markdownpattern
    shortNames: [mdpat]
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [name, html]
              properties:
                name:
                  type: string
                  description: "Identifier used in markdown: |||name content|||"
                label:
                  type: string
                description:
                  type: string
                html:
                  type: string
                  description: "HTML template; use {{content}} as placeholder"
                css:
                  type: string
                js:
                  type: string
                  description: "JS executed after rendering (container is the wrapper element)"
                scope:
                  type: string
                  default: global
      additionalPrinterColumns:
        - name: Label
          type: string
          jsonPath: .spec.label
        - name: Scope
          type: string
          jsonPath: .spec.scope
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: courses.elearning.example.com
spec:
  group: elearning.example.com
  names:
    kind: Course
    plural: courses
    singular: course
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                public:
                  type: boolean
                  description: "When true, the course is publicly visible and users are auto-enrolled on first access"
                hidden:
                  type: boolean
                  description: "When true, the course is hidden from the catalog"
                category:
                  type: string
                difficulty:
                  type: string
                modules:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [video, text, image, quiz, lab, modules]
                      src:
                        type: string
                      ref:
                        type: string
                      path:
                        type: string
                      replication:
                        type: boolean
                      hidden:
                        type: boolean
                      inline:
                        type: boolean
                        description: "When true (quiz type only), rendered inline at the bottom of the previous module"
                      quiz_ref:
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
                prerequisites:
                  type: array
                  description: "Courses that must be completed before this one is accessible"
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      course:
                        type: string
                      min_score:
                        type: integer
                      modules:
                        type: array
                        items:
                          type: string