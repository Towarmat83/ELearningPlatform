apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
- role: control-plane
  extraPortMappings:
  # ── Platform services ──────────────────────────────────────
  - containerPort: 30080
    hostPort: 8080    # frontend (npm run dev in dev mode)
    protocol: TCP
  - containerPort: 30081
    hostPort: 8081    # user-service
    protocol: TCP
  - containerPort: 30082
    hostPort: 8082    # course-service
    protocol: TCP
  - containerPort: 30083
    hostPort: 8083    # checker-service
    protocol: TCP
  - containerPort: 30090
    hostPort: 9090    # Prometheus / metrics
    protocol: TCP
  # ── GitLab CE ──────────────────────────────────────────────
  - containerPort: 30880
    hostPort: 8880    # GitLab HTTP  → http://gitlab.local:8880
    protocol: TCP
  - containerPort: 30022
    hostPort: 2222    # GitLab SSH   → ssh://git@localhost:2222
    protocol: TCP
  # ── Keycloak ───────────────────────────────────────────────
  - containerPort: 30884
    hostPort: 8884    # Keycloak HTTP → http://keycloak.local:8884
    protocol: TCP
