# ─────────────────────────────────────────────────────────────────────────────
# eLearning Platform — Helm Values
# ─────────────────────────────────────────────────────────────────────────────

# ── Name overrides ────────────────────────────────────────────────────────────
nameOverride: ""
fullnameOverride: ""

# ── Cluster ───────────────────────────────────────────────────────────────────
# Override when your cluster uses a non-standard DNS domain.
clusterDomain: cluster.local

# ── Secrets ───────────────────────────────────────────────────────────────────

# Shared JWT secret — must match between services.
# Three modes (same priority order as admin.password):
#   1. jwtExistingSecret — reference a pre-existing K8s Secret (Vault / ESO / SOPS)
#   2. jwtSecret non-empty — explicit value rendered into the chart Secret
#   3. Default — the placeholder value below (change before production)
jwtSecret: "change-me-in-production-use-a-long-random-string"
jwtExistingSecret: ""
jwtExistingSecretKey: "JWT_SECRET"

# Image pull secrets — for private registries.
# imagePullSecrets:
#   - name: ghcr-credentials
imagePullSecrets: []

# NetworkPolicies — restrict pod-to-pod traffic.
# Requires a CNI that supports NetworkPolicy (Calico, Cilium, Weave…).
networkPolicy:
  enabled: false

# ── Admin account ─────────────────────────────────────────────────────────────
# Seeded by user-service on startup (idempotent). Three modes:
#
#   Mode 1 — auto-generated (default):
#     Leave password empty. A random 32-char password is generated on first
#     install and persisted in the release Secret. Retrieve it with:
#       kubectl get secret <release>-secrets \
#         -o jsonpath='{.data.ADMIN_PASSWORD}' | base64 -d
#
#   Mode 2 — explicit:
#     admin.password: "MyStr0ngPassw0rd!"
#
#   Mode 3 — existing K8s Secret (Vault / ESO / SOPS):
#     admin.existingSecret: "my-admin-secret"
#
# Passwords may be cleartext or a bcrypt hash (values starting with "$2").
admin:
  password: ""
  existingSecret: ""
  existingSecretKey: "ADMIN_PASSWORD"

# ── Services ──────────────────────────────────────────────────────────────────

courseService:
  replicaCount: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  topologySpreadConstraints: []
  # Production example — spread across nodes:
  # topologySpreadConstraints:
  #   - maxSkew: 1
  #     topologyKey: kubernetes.io/hostname
  #     whenUnsatisfiable: DoNotSchedule
  #     labelSelector:
  #       matchLabels:
  #         app.kubernetes.io/component: course-service
  image:
    repository: ghcr.io/towarmat83/elearning-course-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env:
    JWT_EXPIRY_HOURS: "24"
    GIT_CACHE_TTL: "10"
  # Git token for private repository access.
  # gitTokenExistingSecret: "my-git-secret"   # preferred for production
  # gitTokenExistingSecretKey: "GIT_TOKEN"
  gitToken: ""
  gitTokenExistingSecret: ""
  gitTokenExistingSecretKey: "GIT_TOKEN"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}

checkerService:
  replicaCount: 1
  image:
    repository: ghcr.io/towarmat83/elearning-checker-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8083
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  env:
    GITLAB_BASE_URL: "http://gitlab.local:8880"
  # GitLab API token for checker-service (stored in the platform Secret as GITLAB_TOKEN)
  gitLabToken: ""
  nodeSelector: {}

userService:
  replicaCount: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  topologySpreadConstraints: []
  image:
    repository: ghcr.io/towarmat83/elearning-user-service
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    JWT_EXPIRY_HOURS: "24"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  nodeSelector: {}

frontend:
  replicaCount: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  topologySpreadConstraints: []
  image:
    repository: ghcr.io/towarmat83/elearning-frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

# ── SSO / OAuth ───────────────────────────────────────────────────────────────
# redirectBase: public URL sent to the providers as redirect_uri.
#   Defaults to the ingress host when empty.
#   Can also be overridden at runtime via the admin UI (oidc_redirect_base setting).
#
# Two complementary mechanisms:
#   - sso.oidc      → a single OpenID Connect provider (e.g. Keycloak). Seeded
#                     into the platform settings on startup; configurable later
#                     in the admin UI. Recommended for Keycloak.
#   - sso.providers → one or more OAuth2/OIDC providers (GitHub, GitLab, Google…).
#
# In BOTH cases client secrets are sourced from a Kubernetes Secret, never
# hardcoded in the chart. For dev you may put the secret inline (clientSecret /
# client_secret) and the chart renders it into the release Secret; for production
# point at an existingSecret you manage (Vault / External Secrets / SOPS).
sso:
  enabled: false
  redirectBase: ""

  # ── OpenID Connect provider (Keycloak, Authentik, …) ──────────────────────
  # When enabled, these values seed the OIDC platform settings on startup. The
  # client secret is mounted from a Secret and re-seeded on each pod start, so
  # rotating it requires a pod restart.
  oidc:
    enabled: false
    # OIDC discovery URL. For Keycloak: https://<host>/realms/<realm>
    providerURL: ""
    # Optional. Set when the discovery URL is cluster-internal but the issuer
    # claim in tokens is the public URL (split-horizon, e.g. KinD).
    issuerURL: ""
    clientID: ""
    # Cleartext client secret — dev only. Rendered into the release Secret.
    # For production leave empty and use existingSecret below.
    clientSecret: ""
    scopes: "openid email profile groups"
    groupClaim: "groups"
    # Optional. Rewrites the internal base URL to a browser-reachable one in the
    # authorize redirect (split-horizon).
    browserBaseURL: ""
    # Optional per-OIDC redirect base override (defaults to sso.redirectBase).
    redirectBase: ""
    # ── Production secret sourcing (Vault / External Secrets / SOPS) ──
    # Name of an existing Secret holding the client secret. Empty disables it.
    existingSecret: ""
    existingSecretKey: "OIDC_CLIENT_SECRET"

  # ── OAuth2 / OIDC providers ───────────────────────────────────────────────
  # Each provider's client secret is injected from a Secret (env var), not the
  # ConfigMap. Supply it inline via client_secret (rendered into the release
  # Secret) OR reference an existingSecret/existingSecretKey you manage.
  #
  #   - id: github          # OAuth2 — no issuer_url needed
  #     name: GitHub
  #     client_id: "..."
  #     client_secret: "..."           # dev: rendered into the release Secret
  #
  #   - id: gitlab
  #     name: GitLab
  #     client_id: "..."
  #     issuer_url: "https://gitlab.com"
  #     existingSecret: gitlab-oauth    # prod: secret you manage
  #     existingSecretKey: client_secret
  #
  #   - id: google
  #     name: Google
  #     client_id: "..."
  #     client_secret: "..."
  #     issuer_url: "https://accounts.google.com"
  providers: []

# ── Ingress ───────────────────────────────────────────────────────────────────
# Path order matters — more specific paths must come before broader ones.
ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: elearning.local
      paths:
        - { path: /api/auth,          pathType: Prefix, backend: user-service   }
        - { path: /api/settings,      pathType: Prefix, backend: user-service   }
        - { path: /api/my,            pathType: Prefix, backend: user-service   }
        - { path: /api/admin/courses, pathType: Prefix, backend: course-service }
        - { path: /api/admin,         pathType: Prefix, backend: user-service   }
        - { path: /api/courses,       pathType: Prefix, backend: course-service }
        - { path: /uploads,           pathType: Prefix, backend: course-service }
        - { path: /health,            pathType: Exact,  backend: course-service }
        - { path: /metrics,           pathType: Prefix, backend: course-service }
        - { path: /,                  pathType: Prefix, backend: frontend       }
  tls: []

# ── Database ──────────────────────────────────────────────────────────────────
# `database` is the single source of truth for connection + credentials. It is
# shared by the bundled PostgreSQL (when postgresql.enabled=true) and by the
# application services.
#
#   Option A — bundled PostgreSQL (dev / small deployments):
#     postgresql.enabled: true
#     The in-cluster instance is provisioned from database.auth and database.name;
#     services connect to it automatically (database.host/port are ignored).
#
#   Option B — external / managed database (production):
#     postgresql.enabled: false
#     Point database.host/port/name at your managed PostgreSQL and supply
#     credentials through database.auth.existingSecret (no secrets in values).

# Toggle + runtime settings for the bundled in-cluster PostgreSQL.
# Credentials/connection live under `database` below — not here.
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent
  persistence:
    enabled: false
    size: 5Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

database:
  # Connection target for an EXTERNAL database (Option B).
  # Ignored when postgresql.enabled=true — services then reach the in-cluster
  # Service at <release>-postgresql.<namespace>.svc.<clusterDomain>:5432.
  host: "postgresql.example.com"
  port: 5432
  # Database (schema) name. Also used to provision the bundled instance.
  name: elearning
  auth:
    username: elearning
    # Cleartext password. Fine for dev; for production leave this and rely on
    # existingSecret instead so no credentials are committed to values.
    password: elearning_secret
    # ── Production secret sourcing (Vault / External Secrets / SOPS) ──
    # Name of an existing Secret to read credentials from. Empty disables it.
    existingSecret: ""
    # Key holding the FULL connection string, e.g.
    #   postgres://user:pass@host:5432/db
    # Preferred for external databases: DATABASE_URL is read straight from the
    # Secret and never rendered into the chart's own Secret. Set to "" to instead
    # have the URL assembled from the fields above (e.g. password-only secrets).
    urlKey: "DATABASE_URL"
    # Key holding ONLY the password. Used as POSTGRES_PASSWORD for the bundled
    # database when postgresql.enabled=true.
    passwordKey: "db_password"
