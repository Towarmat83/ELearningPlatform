id: quiz-navigation
title: "Quiz Navigation"
passing_score: 60
questions:
  - id: q1
    type: single
    points: 2
    question: "Que représente le répertoire '/' sous Linux ?"
    answers:
      - id: a
        text: "Le répertoire personnel de l'utilisateur"
        correct: false
      - id: b
        text: "La racine du système de fichiers"
        correct: true
      - id: c
        text: "Le répertoire temporaire"
        correct: false
      - id: d
        text: "Le répertoire des programmes installés"
        correct: false
    feedback:
      correct: "Exact ! '/' est la racine, point de départ de toute l'arborescence Linux."
      wrong: "'/' est la racine du système de fichiers, tout part de là."

  - id: q2
    type: single
    points: 2
    question: "Quelle commande affiche le chemin du répertoire courant ?"
    answers:
      - id: a
        text: "ls"
        correct: false
      - id: b
        text: "cd"
        correct: false
      - id: c
        text: "pwd"
        correct: true
      - id: d
        text: "mkdir"
        correct: false
    feedback:
      correct: "Correct ! 'pwd' signifie Print Working Directory."
      wrong: "La commande 'pwd' (Print Working Directory) affiche le chemin courant."

  - id: q3
    type: boolean
    points: 1
    question: "La commande 'ls -la' affiche également les fichiers et dossiers cachés (commençant par '.')."
    correct_answer: true
    feedback:
      correct: "Exact ! Le flag '-a' (all) inclut les fichiers cachés dans la liste."
      wrong: "Le flag '-a' de la commande 'ls' affiche bien les fichiers cachés."

  - id: q4
    type: single
    points: 2
    question: "Que représente '..' dans un chemin de fichier Linux ?"
    answers:
      - id: a
        text: "Le répertoire courant"
        correct: false
      - id: b
        text: "Le répertoire parent"
        correct: true
      - id: c
        text: "Un fichier caché"
        correct: false
      - id: d
        text: "Le répertoire racine"
        correct: false
    feedback:
      correct: "Exact ! '..' remonte d'un niveau dans l'arborescence."
      wrong: "'..' désigne toujours le répertoire parent du répertoire courant."

  - id: q5
    type: order
    points: 3
    question: "Classez ces commandes dans le bon ordre pour : créer un dossier, y entrer, puis lister son contenu."
    items:
      - id: mkdir
        text: "mkdir mon-dossier"
      - id: cd
        text: "cd mon-dossier"
      - id: ls
        text: "ls"
    correct_order:
      - mkdir
      - cd
      - ls
    feedback:
      correct: "Parfait ! On crée, on entre, puis on liste."
      wrong: "L'ordre logique est : créer le dossier (mkdir), y entrer (cd), puis lister (ls)."
