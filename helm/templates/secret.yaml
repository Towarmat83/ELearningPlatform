apiVersion: v1
kind: Secret
metadata:
  name: {{ include "elearning.fullname" . }}-secrets
  labels:
    {{- include "elearning.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.jwtSecret | quote }}
  {{- if not (and (not .Values.postgresql.enabled) .Values.externalDatabase.existingSecret) }}
  DATABASE_URL: {{ include "elearning.databaseUrl" . | quote }}
  {{- end }}
  {{- if not .Values.admin.existingSecret }}
  ADMIN_PASSWORD: {{ include "elearning.adminPassword" . | quote }}
  {{- end }}
