---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "elearning.fullname" . }}-course-service
  labels:
    {{- include "elearning.courseService.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "elearning.fullname" . }}-course-service
  labels:
    {{- include "elearning.courseService.labels" . | nindent 4 }}
rules:
  - apiGroups: ["elearning.example.com"]
    resources: ["courses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "elearning.fullname" . }}-course-service
  labels:
    {{- include "elearning.courseService.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "elearning.fullname" . }}-course-service
subjects:
  - kind: ServiceAccount
    name: {{ include "elearning.fullname" . }}-course-service
    namespace: {{ .Release.Namespace }}
