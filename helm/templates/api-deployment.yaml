apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elearning.fullname" . }}-api
  labels:
    {{- include "elearning.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "elearning.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "elearning.api.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.api.service.port }}"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.api.service.port | quote }}
            - name: JWT_EXPIRY_HOURS
              value: {{ .Values.api.env.JWT_EXPIRY_HOURS | quote }}
            - name: RUST_LOG
              value: {{ .Values.api.env.RUST_LOG | quote }}
            - name: CORS_ORIGINS
              value: "http://{{ (first .Values.ingress.hosts).host }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "elearning.fullname" . }}-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "elearning.fullname" . }}-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
