{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "elearning.fullname" . }}-prometheus-config
  labels:
    {{- include "elearning.prometheus.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'elearning-api'
        static_configs:
          - targets: ['{{ include "elearning.fullname" . }}-api:{{ .Values.api.service.port }}']
        metrics_path: '/metrics'
        scrape_interval: 15s

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:{{ .Values.prometheus.service.port }}']

      {{- with .Values.prometheus.extraScrapeConfigs }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
