apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "elearning.fullname" . }}-frontend
  labels:
    {{- include "elearning.frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "elearning.frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elearning.frontend.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.frontend.service.port | quote }}
            - name: NODE_ENV
              value: production
            - name: ORIGIN
              value: {{ include "elearning.publicUrl" . | quote }}
            - name: PUBLIC_API_URL
              value: {{ include "elearning.publicUrl" . | quote }}
            - name: INTERNAL_API_URL
              value: "http://{{ include "elearning.fullname" . }}-user-service:{{ .Values.userService.service.port }}"
            - name: COURSE_API
              value: "http://{{ include "elearning.fullname" . }}-course-service:{{ .Values.courseService.service.port }}"
            - name: USER_API
              value: "http://{{ include "elearning.fullname" . }}-user-service:{{ .Values.userService.service.port }}"
            {{- if .Values.ldapService.enabled }}
            - name: LDAP_API
              value: "http://{{ include "elearning.fullname" . }}-ldap-service.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.ldapService.service.port }}"
            {{- end }}
            - name: FRONTEND_CONFIG
              value: /etc/frontend/config.env
          volumeMounts:
            - name: config
              mountPath: /etc/frontend
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "elearning.fullname" . }}-frontend-config
