apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: courses.elearning.example.com
spec:
  group: elearning.example.com
  names:
    kind: Course
    plural: courses
    singular: course
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                public:
                  type: boolean
                  description: "When true, the course is publicly visible and users are auto-enrolled on first access"
                category:
                  type: string
                difficulty:
                  type: string
                modules:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [video, text, image, quiz, modules]
                      src:
                        type: string
                      ref:
                        type: string
                      path:
                        type: string
                      replication:
                        type: boolean
                      hidden:
                        type: boolean
                      quiz_ref:
                        type: string
                    x-kubernetes-preserve-unknown-fields: true
                prerequisites:
                  type: array
                  description: "Courses that must be completed before this one is accessible"
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                    properties:
                      course:
                        type: string
                      min_score:
                        type: integer
                      modules:
                        type: array
                        items:
                          type: string